/* ======================= EXPORT: SVG (M1 -- метки) ======================= */
function exportSVG(){
  const {sheet_w_mm:W,sheet_h_mm:H,originCornerOffset:c} = state.project;
  const x0 = c.x, y0 = c.y;
  let body='';
  for(const o of zOrdered()){
    if(o.hidden) continue;
    body += svgForObject(o, x0, y0, H);
  }
  const svg = `<?xml version="1.0" encoding="UTF-8"?>\n`+
    `<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" `+
    `viewBox="0 0 ${W} ${H}">\n<g id="sheet"><rect x="0" y="0" width="${W}" height="${H}" fill="${CONFIG.colors.sheetBg}"/>\n${body}</g>\n</svg>`;
  downloadBlob(svg, (state.project.name||'map')+'.svg', 'image/svg+xml');
}
// перевод мировых мм (Y вверх) в SVG-координаты листа (Y вниз, начало = угол листа)
function toSvgXY(x,y,x0,y0,H){ return { x: x-x0, y: H-(y-y0) }; }
function svgForObject(o,x0,y0,H){
  if(o.type==='marker') return svgMarker(o,x0,y0,H);
  if(o.type==='shape') return svgShape(o,x0,y0,H);
  if(o.type==='text') return svgText(o,x0,y0,H);
  if(o.type==='image') return svgImage(o,x0,y0,H);
  return '';
}
function svgMarker(o,x0,y0,H){
  const bits = dictBits(o.dictionary,o.markerId);
  const dictMeta = ARUCO_DICTS[o.dictionary]; const n = dictMeta?dictMeta.n:4;
  const nb = o.border_bits, total=n+2*nb, cell=o.size_mm/total, half=o.size_mm/2;
  const blackC = o.invert?CONFIG.colors.markerWhite:CONFIG.colors.markerBlack;
  const whiteC = o.invert?CONFIG.colors.markerBlack:CONFIG.colors.markerWhite;
  const p = toSvgXY(o.x_mm,o.y_mm,x0,y0,H);
  let g = `<g id="marker_${o.markerId}_${o.id}" transform="translate(${p.x} ${p.y}) rotate(${-o.rot_deg})">\n`;
  if(o.quiet_zone_mm>0){
    const qz = half+o.quiet_zone_mm;
    g+=`<rect x="${-qz}" y="${-qz}" width="${qz*2}" height="${qz*2}" fill="${whiteC}"/>\n`;
  }
  g+=`<rect x="${-half}" y="${-half}" width="${o.size_mm}" height="${o.size_mm}" fill="${blackC}"/>\n`;
  if(bits){
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      const bit=bits[r*n+c]; if(!bit) continue; // рисуем только белые ячейки поверх чёрного фона
      const cx=-half+cell*(nb+c), cy=-half+cell*(nb+r);
      g+=`<rect x="${cx}" y="${cy}" width="${cell}" height="${cell}" fill="${whiteC}"/>\n`;
    }
  }
  g+='</g>\n';
  return g;
}
function svgShape(o,x0,y0,H){
  const p = toSvgXY(o.x_mm,o.y_mm,x0,y0,H);
  const fill = o.fill==='none'?'none':o.fill;
  let inner='';
  if(o.shape==='rect') inner=`<rect x="${-o.w_mm/2}" y="${-o.h_mm/2}" width="${o.w_mm}" height="${o.h_mm}" fill="${fill}" stroke="${o.stroke}" stroke-width="${o.strokeWidth_mm}"/>`;
  else if(o.shape==='circle') inner=`<ellipse cx="0" cy="0" rx="${o.w_mm/2}" ry="${o.h_mm/2}" fill="${fill}" stroke="${o.stroke}" stroke-width="${o.strokeWidth_mm}"/>`;
  else if(o.shape==='line') inner=`<line x1="${-o.w_mm/2}" y1="0" x2="${o.w_mm/2}" y2="0" stroke="${o.stroke}" stroke-width="${o.strokeWidth_mm}"/>`;
  else if(o.shape==='cross'){
    const t=Math.min(o.w_mm,o.h_mm)*0.2,w=o.w_mm,h=o.h_mm;
    const pts=[[-w/2,-t/2],[-t/2,-t/2],[-t/2,-h/2],[t/2,-h/2],[t/2,-t/2],[w/2,-t/2],[w/2,t/2],[t/2,t/2],[t/2,h/2],[-t/2,h/2],[-t/2,t/2],[-w/2,t/2]]
      .map(pt=>pt.join(',')).join(' ');
    inner=`<polygon points="${pts}" fill="${fill}" stroke="${o.stroke}" stroke-width="${o.strokeWidth_mm}"/>`;
  }
  return `<g transform="translate(${p.x} ${p.y}) rotate(${-o.rot_deg})">${inner}</g>\n`;
}
function svgText(o,x0,y0,H){
  const p = toSvgXY(o.x_mm,o.y_mm,x0,y0,H);
  const esc = o.text.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return `<g transform="translate(${p.x} ${p.y}) rotate(${-o.rot_deg})">`+
    `<text x="0" y="0" font-family="${o.font}" font-size="${o.size_mm}" fill="${o.color}">${esc}</text></g>\n`;
}
function svgImage(o,x0,y0,H){
  if(!o.src) return '';
  const p = toSvgXY(o.x_mm,o.y_mm,x0,y0,H);
  return `<g transform="translate(${p.x} ${p.y}) rotate(${-o.rot_deg})" opacity="${o.opacity}">`+
    `<image x="${-o.w_mm/2}" y="${-o.h_mm/2}" width="${o.w_mm}" height="${o.h_mm}" href="${o.src}"/></g>\n`;
}
/* ======================= EXPORT: PDF (байты пишем сами, без библиотек) =======================
   Идея: контент каждой страницы -- в системе координат "мм" (задаём это через cm-матрицу
   72/25.4 в начале content stream, дальше все coord в мм). Дерево объектов PDF -- минимальное:
   Catalog -> Pages -> Page[] -> Contents. Шрифт -- встроенный стандартный Helvetica (ASCII:
   подписи ID, номера плиток, калибровочная линейка). Произвольный пользовательский текст
   (объекты type:'text', часто кириллица) без встраивания шрифта в hand-rolled PDF воспроизвести
   вектором нельзя -- поэтому такие объекты растеризуются в 1-битную ImageMask (маленький штамп
   только по факту наличия текстовых объектов на карте), а не во весь documents, оставляя
   основной контент (метки/фигуры) чистым вектором, как требуется. */
const PDF_PAGE_SIZES = { A1:{w:594,h:841}, A2:{w:420,h:594}, A3:{w:297,h:420}, A4:{w:210,h:297}, A5:{w:148,h:210} };
const MM2PT = 72/25.4;

function PdfDoc(){
  this.objs = ['']; // индекс 0 не используется, номера объектов = индексу массива
  this.xobjects = []; // {num, dictExtra, streamBytes} для картинок
}
PdfDoc.prototype.addObj = function(body){ this.objs.push(body); return this.objs.length-1; };
PdfDoc.prototype.reserve = function(){ this.objs.push(null); return this.objs.length-1; };
PdfDoc.prototype.setObj = function(num, body){ this.objs[num]=body; };
PdfDoc.prototype.build = function(catalogNum){
  const enc = new TextEncoder();
  const parts = [enc.encode('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')];
  const offsets = new Array(this.objs.length).fill(0);
  let pos = parts[0].length;
  for(let i=1;i<this.objs.length;i++){
    offsets[i]=pos;
    const body = this.objs[i];
    const bytes = (body instanceof Uint8Array) ? body : enc.encode(`${i} 0 obj\n${body}\nendobj\n`);
    parts.push(bytes); pos += bytes.length;
  }
  const xrefStart = pos;
  let xref = `xref\n0 ${this.objs.length}\n0000000000 65535 f \n`;
  for(let i=1;i<this.objs.length;i++) xref += String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  const trailer = `trailer\n<< /Size ${this.objs.length} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  parts.push(enc.encode(xref+trailer));
  let total=0; for(const p of parts) total+=p.length;
  const out = new Uint8Array(total); let off=0;
  for(const p of parts){ out.set(p,off); off+=p.length; }
  return out;
};
function pdfEscText(s){ return s.replace(/([\\()])/g,'\\$1'); }
function pdfNum(v){ return (Math.round(v*1000)/1000).toString(); }

/* Растеризация текстового объекта в 1-битную маску (для Unicode/кириллицы без шрифта в PDF) */
function rasterizeTextMask(o){
  const pxPerMm = 6; // достаточно для чёткой подписи при печати
  const w = Math.max(1, Math.ceil(textWidthMm(o)*pxPerMm));
  const h = Math.max(1, Math.ceil(o.size_mm*1.4*pxPerMm));
  const cvs = document.createElement('canvas'); cvs.width=w; cvs.height=h;
  const c2 = cvs.getContext('2d');
  c2.fillStyle='#fff'; c2.fillRect(0,0,w,h);
  c2.fillStyle='#000'; c2.font=(o.size_mm*pxPerMm)+'px '+(o.font||'Arial');
  c2.textAlign='left'; c2.textBaseline='alphabetic';
  c2.fillText(o.text, 0, h*0.75);
  const img = c2.getImageData(0,0,w,h).data;
  const rowBytes = Math.ceil(w/8);
  const bits = new Uint8Array(rowBytes*h); bits.fill(0xff); // 1 = не рисовать (фон)
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=(y*w+x)*4; const dark = img[i]<128;
    if(dark){ bits[y*rowBytes+(x>>3)] &= ~(0x80>>(x&7)); }
  }
  return {w,h,bits,widthMm:textWidthMm(o), heightMm:o.size_mm*1.4};
}

/* Тайлинг листа на страницы -- общая математика для реального экспорта И для
   превью в диалоге, чтобы превью гарантированно совпадало с итоговым PDF.
   center: если true, "лишнее" поле (когда сетка страниц больше площадки) делится
   поровну между противоположными краями, а не всё уходит в последнюю плитку --
   при единственной странице это просто центрирует площадку на листе. */
function computePdfTiling({W,H,x0,y0,pageW,pageH,overlap,center}){
  function tileCount(total, page, ov){ return total<=page ? 1 : Math.ceil((total-page)/(page-ov))+1; }
  const nx = tileCount(W,pageW,overlap), ny = tileCount(H,pageH,overlap);
  const totalW = pageW + (nx-1)*(pageW-overlap);
  const totalH = pageH + (ny-1)*(pageH-overlap);
  const startX0 = center ? x0-(totalW-W)/2 : x0;
  const topY = center ? y0+H+(totalH-H)/2 : y0+H;
  return {nx, ny, startX0, topY, pageW, pageH, overlap};
}
function pdfTileRect(tiling, ix, iy){
  const tileX0 = tiling.startX0 + ix*(tiling.pageW-tiling.overlap);
  const tileY1 = tiling.topY - iy*(tiling.pageH-tiling.overlap);
  return {tileX0, tileY0: tileY1-tiling.pageH};
}

/* ---- Легенда меток (опционально печатается в углу первой страницы): по каждой
   уникальной паре словарь+размер -- список использованных ID (сжатый в диапазоны).
   Текст полностью ASCII (латиница/цифры) -- рисуется настоящим векторным Helvetica,
   без растеризации (см. общее ограничение на кириллицу в шапке PDF-секции). */
function buildMarkerLegendGroups(){
  const groups = new Map();
  for(const o of state.objects){
    if(o.type!=='marker' || o.hidden) continue;
    const key = o.dictionary+'|'+o.size_mm;
    if(!groups.has(key)) groups.set(key, {dict:o.dictionary, size:o.size_mm, ids:[]});
    groups.get(key).ids.push(o.markerId);
  }
  return Array.from(groups.values()).map(g=>{ g.ids.sort((a,b)=>a-b); return g; });
}
function formatIdRanges(ids){
  const parts=[]; let start=null, prev=null;
  for(const id of ids){
    if(start===null){ start=id; prev=id; continue; }
    if(id===prev+1){ prev=id; continue; }
    parts.push(start===prev?`${start}`:`${start}-${prev}`);
    start=id; prev=id;
  }
  if(start!==null) parts.push(start===prev?`${start}`:`${start}-${prev}`);
  return parts.join(', ');
}
function pdfLegendLines(){
  const groups = buildMarkerLegendGroups();
  if(!groups.length) return null;
  const lines = ['Marker legend:'];
  for(const g of groups){
    const meta = ARUCO_DICTS[g.dict]; const n = meta?meta.n:'?';
    lines.push(`${g.dict} (${n}x${n}), ${pdfNum(g.size)}mm: ID ${formatIdRanges(g.ids)}`);
  }
  return lines;
}
function pdfLegendContent(pageW, corner){
  const lines = pdfLegendLines(); if(!lines) return '';
  const sizeMm=3.2, lineH=sizeMm*1.6, marginMm=5;
  const maxLen = Math.max(...lines.map(l=>l.length));
  const blockWidth = maxLen*sizeMm*0.55;
  const x = corner==='br' ? Math.max(marginMm, pageW-blockWidth-marginMm) : marginMm;
  const yStart = corner==='bl' ? 15 : marginMm; // слева снизу уже калибровочная линейка -- поднимаем блок выше неё
  let s = '0 0 0 rg\n';
  lines.forEach((line,i)=>{ s += pdfText(x, yStart+i*lineH, sizeMm, line); });
  return s;
}

function exportPDF(opts){
  const {pageW, pageH, overlap, labels, center, legendCorner} = opts;
  const {sheet_w_mm:W, sheet_h_mm:H, originCornerOffset:corner} = state.project;
  const x0 = corner.x, y0 = corner.y;
  const tiling = computePdfTiling({W,H,x0,y0,pageW,pageH,overlap,center});
  const nx = tiling.nx, ny = tiling.ny;

  const doc = new PdfDoc();
  const fontNum = doc.addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
  const pagesNum = doc.reserve();
  const kids = [];
  const imageCacheNum = new Map(); // markerId->objnum кэш растеризованных текстов по object.id

  for(let iy=0; iy<ny; iy++){
    for(let ix=0; ix<nx; ix++){
      const {tileX0, tileY0} = pdfTileRect(tiling, ix, iy);
      const xObjRefs = [];
      let content = `q ${pdfNum(MM2PT)} 0 0 ${pdfNum(MM2PT)} 0 0 cm\n`;
      content += `1 1 1 rg 0 0 ${pdfNum(pageW)} ${pdfNum(pageH)} re f\n`;
      // объекты, чей bbox пересекает тайл
      for(const o of zOrdered()){
        if(o.hidden) continue;
        const pts = objBoundsWorld(o);
        const bMinX=Math.min(...pts.map(p=>p.x)), bMaxX=Math.max(...pts.map(p=>p.x));
        const bMinY=Math.min(...pts.map(p=>p.y)), bMaxY=Math.max(...pts.map(p=>p.y));
        if(bMaxX<tileX0 || bMinX>tileX0+pageW || bMaxY<tileY0 || bMinY>tileY0+pageH) continue;
        content += pdfDrawObject(o, tileX0, tileY0, pageH, labels, doc, imageCacheNum, xObjRefs);
      }
      // калибровочная линейка 100 мм (низ страницы, всегда в мм точно)
      content += `0 0 0 RG 1 w\n`;
      content += `5 5 m 105 5 l S\n`;
      content += `5 3 m 5 8 l S\n105 3 m 105 8 l S\n`;
      content += pdfText(6, 10, 3.2, '100 mm - must be exactly 100 mm (no "fit to page")');
      // легенда меток -- только на первой странице, в выбранном нижнем углу
      if(legendCorner && ix===0 && iy===0) content += pdfLegendContent(pageW, legendCorner);
      // подпись плитки + линии склейки (нахлёст)
      const tileLabel = `Tile ${String.fromCharCode(65+ix)}${iy+1} of ${nx}x${ny}`;
      content += pdfText(pageW-70, pageH-8, 3.5, tileLabel);
      content += `0.6 0.6 0.6 RG [2 2] 0 d 0.5 w\n`;
      if(ix<nx-1){ content += `${pdfNum(pageW-overlap)} 0 m ${pdfNum(pageW-overlap)} ${pdfNum(pageH)} l S\n`; }
      if(iy<ny-1){ content += `0 ${pdfNum(overlap)} m ${pdfNum(pageW)} ${pdfNum(overlap)} l S\n`; }
      content += `[] 0 d\n`;
      // обрезные метки по углам
      content += pdfCropMarks(pageW,pageH);
      content += `Q`;

      const contentNum = doc.addObj(`<< /Length ${new TextEncoder().encode(content).length} >>\nstream\n${content}\nendstream`);
      const resXObj = xObjRefs.length ? ` /XObject << ${xObjRefs.map((n,i)=>`/Im${n} ${n} 0 R`).join(' ')} >>` : '';
      const pageNum = doc.addObj(`<< /Type /Page /Parent ${pagesNum} 0 R /MediaBox [0 0 ${pdfNum(pageW*MM2PT)} ${pdfNum(pageH*MM2PT)}] `+
        `/Resources << /Font << /F1 ${fontNum} 0 R >>${resXObj} >> /Contents ${contentNum} 0 R >>`);
      kids.push(pageNum);
    }
  }
  doc.setObj(pagesNum, `<< /Type /Pages /Kids [ ${kids.map(k=>k+' 0 R').join(' ')} ] /Count ${kids.length} >>`);
  const catalogNum = doc.addObj(`<< /Type /Catalog /Pages ${pagesNum} 0 R >>`);
  const bytes = doc.build(catalogNum);
  downloadBlob(new Blob([bytes],{type:'application/pdf'}), (state.project.name||'map')+'.pdf', 'application/pdf');
}
function pdfText(x,y,sizeMm,text){
  return `BT /F1 ${pdfNum(sizeMm*2.6)} Tf ${pdfNum(x)} ${pdfNum(y)} Td (${pdfEscText(text)}) Tj ET\n`;
}
function pdfCropMarks(pw,ph){
  const L=4;
  let s='0 0 0 RG 0.4 w\n';
  const corners=[[0,0],[pw,0],[0,ph],[pw,ph]];
  for(const [cx,cy] of corners){
    const sx = cx===0?1:-1, sy=cy===0?1:-1;
    s+=`${pdfNum(cx)} ${pdfNum(cy+sy*0)} m ${pdfNum(cx)} ${pdfNum(cy+sy*L)} l S\n`;
    s+=`${pdfNum(cx)} ${pdfNum(cy)} m ${pdfNum(cx+sx*L)} ${pdfNum(cy)} l S\n`;
  }
  return s;
}
// Возвращает content-stream фрагмент для одного объекта в координатах страницы (низ-слева=0,0, мм),
// с учётом положения тайла (tileX0,tileY0 -- мировой мин-угол тайла) и переворота Y (PDF -- тоже Y вверх! повезло: не нужен flip, т.к. МЫ сами задаём низ страницы = tileY0).
function pdfDrawObject(o, tileX0, tileY0, pageH, labels, doc, imageCacheNum, xObjRefs){
  function toPage(x,y){ return {x:x-tileX0, y:y-tileY0}; }
  let s='';
  if(o.type==='marker'){
    const bits = dictBits(o.dictionary,o.markerId);
    const meta = ARUCO_DICTS[o.dictionary]; const n=meta?meta.n:4;
    const nb=o.border_bits, total=n+2*nb, cell=o.size_mm/total, half=o.size_mm/2;
    const blackC = o.invert?[1,1,1]:[0,0,0], whiteC=o.invert?[0,0,0]:[1,1,1];
    // quiet zone -- закрашиваем явно (белым), чтобы перекрыть то, что нарисовано ниже
    // по z (важно для сценария вложенных меток -- см. canvas/SVG рендер, тот же приём).
    if(o.quiet_zone_mm>0) s+=pdfPolyFill(rectCornersWorld(o,half+o.quiet_zone_mm,half+o.quiet_zone_mm), toPage, whiteC);
    // фон метки (чёрный квадрат) как повёрнутый полигон
    s+=pdfPolyFill(rectCornersWorld(o,half,half), toPage, blackC);
    if(bits){
      for(let r=0;r<n;r++) for(let c=0;c<n;c++){
        if(!bits[r*n+c]) continue; // рисуем только белые ячейки
        // r=0 -- верхний ряд метки (см. markerCellPolygon); PDF-страница тоже Y вверх,
        // поэтому строка переворачивается: nb+(n-1-r).
        const lx=-half+cell*(nb+c), ly=-half+cell*(nb+(n-1-r));
        const local=[[lx,ly],[lx+cell,ly],[lx+cell,ly+cell],[lx,ly+cell]];
        const world = local.map(([dx,dy])=>worldFromLocal(o,dx,dy));
        s+=pdfPolyFill(world, toPage, whiteC);
      }
    }
    if(labels){
      const p = toPage(...Object.values(worldFromLocal(o,0,-half-o.quiet_zone_mm-2)));
      s+=pdfText(p.x-4, p.y-2.5, 3, 'ID '+o.markerId);
    }
  } else if(o.type==='shape'){
    const col = o.stroke ? hexToRgb01(o.stroke) : [0,0,0];
    const fillCol = (o.fill && o.fill!=='none') ? hexToRgb01(o.fill) : null;
    if(o.shape==='rect'){
      const world = rectCornersWorld(o,o.w_mm/2,o.h_mm/2);
      if(fillCol) s+=pdfPolyFill(world, toPage, fillCol);
      if(o.strokeWidth_mm>0) s+=pdfPolyStroke(world, toPage, col, o.strokeWidth_mm);
    } else if(o.shape==='circle'){
      const N=32, pts=[];
      for(let i=0;i<N;i++){ const a=2*Math.PI*i/N; pts.push(worldFromLocal(o, Math.cos(a)*o.w_mm/2, Math.sin(a)*o.h_mm/2)); }
      if(fillCol) s+=pdfPolyFill(pts, toPage, fillCol);
      if(o.strokeWidth_mm>0) s+=pdfPolyStroke(pts, toPage, col, o.strokeWidth_mm, true);
    } else if(o.shape==='line'){
      const a=toPage(...Object.values(worldFromLocal(o,-o.w_mm/2,0))), b=toPage(...Object.values(worldFromLocal(o,o.w_mm/2,0)));
      s+=`${col.join(' ')} RG ${pdfNum(o.strokeWidth_mm)} w\n${pdfNum(a.x)} ${pdfNum(a.y)} m ${pdfNum(b.x)} ${pdfNum(b.y)} l S\n`;
    } else if(o.shape==='cross'){
      const t=Math.min(o.w_mm,o.h_mm)*0.2, w=o.w_mm, h=o.h_mm;
      const local=[[-w/2,-t/2],[-t/2,-t/2],[-t/2,-h/2],[t/2,-h/2],[t/2,-t/2],[w/2,-t/2],[w/2,t/2],[t/2,t/2],[t/2,h/2],[-t/2,h/2],[-t/2,t/2],[-w/2,t/2]];
      const world = local.map(([dx,dy])=>worldFromLocal(o,dx,dy));
      if(fillCol) s+=pdfPolyFill(world, toPage, fillCol);
      if(o.strokeWidth_mm>0) s+=pdfPolyStroke(world, toPage, col, o.strokeWidth_mm);
    }
  } else if(o.type==='image'){
    // растровые подложки: для краткости в PDF не встраиваем (см. ограничения реализации);
    // векторная рамка-плейсхолдер, чтобы позиция была видна.
    const world = rectCornersWorld(o,o.w_mm/2,o.h_mm/2);
    s+=pdfPolyStroke(world, toPage, [0.6,0.6,0.6], 0.3);
  } else if(o.type==='text'){
    let num = imageCacheNum.get(o.id);
    if(num==null){
      const mask = rasterizeTextMask(o);
      const streamHeader = `<< /Type /XObject /Subtype /Image /Width ${mask.w} /Height ${mask.h} /ImageMask true /BitsPerComponent 1 /Length ${mask.bits.length} >>\nstream\n`;
      const streamFooter = `\nendstream`;
      const enc = new TextEncoder();
      const head = enc.encode(streamHeader), foot = enc.encode(streamFooter);
      const full = new Uint8Array(head.length+mask.bits.length+foot.length);
      full.set(head,0); full.set(mask.bits,head.length); full.set(foot,head.length+mask.bits.length);
      num = doc.reserve();
      doc.setObj(num, wrapPdfObjBytes(num, full));
      imageCacheNum.set(o.id, num);
      xObjRefs.push(num);
      o._pdfMaskW=mask.w; o._pdfMaskH=mask.h; o._pdfWmm=mask.widthMm; o._pdfHmm=mask.heightMm;
    } else if(xObjRefs.indexOf(num)<0) xObjRefs.push(num);
    const p0 = toPage(...Object.values(worldFromLocal(o,0,0)));
    const rad = o.rot_deg*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
    const wmm=o._pdfWmm||textWidthMm(o), hmm=o._pdfHmm||o.size_mm*1.4;
    const col = hexToRgb01(o.color||'#000000');
    s += `q ${col.join(' ')} rg ${pdfNum(wmm*cos)} ${pdfNum(wmm*sin)} ${pdfNum(-hmm*sin)} ${pdfNum(hmm*cos)} ${pdfNum(p0.x)} ${pdfNum(p0.y)} cm /Im${num} Do Q\n`;
  }
  return s;
}
function wrapPdfObjBytes(num, dictAndStreamBytes){
  const enc=new TextEncoder();
  const head = enc.encode(`${num} 0 obj\n`), foot=enc.encode(`\nendobj\n`);
  const out = new Uint8Array(head.length+dictAndStreamBytes.length+foot.length);
  out.set(head,0); out.set(dictAndStreamBytes,head.length); out.set(foot,head.length+dictAndStreamBytes.length);
  return out;
}
function rectCornersWorld(o,hw,hh){ return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([dx,dy])=>worldFromLocal(o,dx,dy)); }
function pdfPolyFill(worldPts, toPage, rgb){
  const pts = worldPts.map(p=>toPage(p.x,p.y));
  let s = `${rgb.join(' ')} rg\n${pdfNum(pts[0].x)} ${pdfNum(pts[0].y)} m `;
  for(let i=1;i<pts.length;i++) s+=`${pdfNum(pts[i].x)} ${pdfNum(pts[i].y)} l `;
  s+='h f\n';
  return s;
}
function pdfPolyStroke(worldPts, toPage, rgb, widthMm, closed){
  const pts = worldPts.map(p=>toPage(p.x,p.y));
  let s = `${rgb.join(' ')} RG ${pdfNum(widthMm)} w\n${pdfNum(pts[0].x)} ${pdfNum(pts[0].y)} m `;
  for(let i=1;i<pts.length;i++) s+=`${pdfNum(pts[i].x)} ${pdfNum(pts[i].y)} l `;
  if(closed!==false) s+='h ';
  s+='S\n';
  return s;
}
function hexToRgb01(hex){
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||'#000000') || ['','00','00','00'];
  return [parseInt(m[1],16)/255, parseInt(m[2],16)/255, parseInt(m[3],16)/255].map(v=>Math.round(v*1000)/1000);
}

function downloadBlob(content, filename, mime){
  const blob = content instanceof Blob ? content : new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
}
/* ======================= EXPORT: PNG ======================= */
/* Самопроверка перед экспортом PNG: пересэмплирует КАЖДУЮ метку на итоговом
   растре в позициях центров её ячеек и сверяет с ожидаемым кодом словаря.
   Не заменяет проверку настоящим детектором (не проверяет устойчивость к
   перспективе/шуму камеры), но ловит именно тот класс багов, из-за которого
   карта вообще не детектируется -- неверную геометрию/ориентацию рендера
   (например, зеркалирование по строкам) -- поскольку сэмплирует РЕАЛЬНЫЕ
   пиксели итогового изображения независимым способом (прямой поворот вокруг
   центра метки), а не переиспользует внутренние функции трансформации канвы.
   Если бы этот самоконтроль стоял здесь раньше, он поймал бы баг с зеркалом
   меток мгновенно при экспорте, а не на печати/в симуляторе. */
function selfCheckMarkerRendering(offCtx, cw, ch, viewForExport, objects){
  const problems = [];
  for(const o of objects){
    if(o.type!=='marker' || o.hidden) continue;
    const bits = dictBits(o.dictionary, o.markerId);
    const meta = ARUCO_DICTS[o.dictionary];
    if(!bits || !meta) continue;
    const n=meta.n, nb=o.border_bits, total=n+2*nb, cell=o.size_mm/total, half=o.size_mm/2;
    const rad=o.rot_deg*Math.PI/180, cosr=Math.cos(rad), sinr=Math.sin(rad);
    // объекты поверх этой метки (выше по z) законно перекрывают часть её ячеек --
    // это ровно сценарий вложенных меток (см. analyzeNestedMarker), а не баг рендера.
    // Такие ячейки просто пропускаем, а не считаем несовпадением.
    const above = objects.filter(x=>x!==o && !x.hidden && x.z>o.z);
    let mismatches=0, checked=0, covered=0;
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){
      // r=0 -- верхний ряд метки (см. markerCellPolygon/pdfDrawObject): в локальной
      // системе (+Y вверх) это наибольший Y, отсюда nb+(n-1-r), а не nb+r.
      const lx=-half+cell*(nb+c)+cell/2, ly=-half+cell*(nb+(n-1-r))+cell/2;
      const wx=o.x_mm+lx*cosr-ly*sinr, wy=o.y_mm+lx*sinr+ly*cosr;
      if(above.some(x=>pointInObj(wx,wy,x))){ covered++; continue; }
      const px=Math.round(viewForExport.ox+wx*viewForExport.scale);
      const py=Math.round(viewForExport.oy-wy*viewForExport.scale);
      if(px<0||py<0||px>=cw||py>=ch) continue;
      const d = offCtx.getImageData(px,py,1,1).data;
      checked++;
      if((d[0]>128?1:0)!==bits[r*n+c]) mismatches++;
    }
    if(checked>0 && mismatches>checked*0.1){
      problems.push({markerId:o.markerId, dictionary:o.dictionary, mismatches, checked, covered});
    }
  }
  return problems;
}

/* Добавляет в PNG чанк pHYs (пикселей на метр) -- программы просмотра/печати
   тогда сами показывают верный физический размер, без ручного подсчёта
   пикселей и высчитывания масштаба (см. жалобу про "не влезает точно"). */
let PNG_CRC_TABLE = null;
function crc32(bytes){
  if(!PNG_CRC_TABLE){
    PNG_CRC_TABLE = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
      PNG_CRC_TABLE[n]=c>>>0;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) crc = PNG_CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function buildPngChunk(type, data){
  const typeBytes = new TextEncoder().encode(type);
  const out = new Uint8Array(4+4+data.length+4);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, data.length);
  out.set(typeBytes, 4);
  out.set(data, 8);
  dv.setUint32(8+data.length, crc32(out.slice(4,8+data.length)));
  return out;
}
async function pngWithPhys(blob, pxPerMm){
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const ihdrEnd = 8+8+13+4; // сигнатура(8) + длина+тип(8) + данные IHDR(13) + CRC(4)
  const pxPerMeter = Math.round(pxPerMm*1000);
  const physData = new Uint8Array(9);
  const dv = new DataView(physData.buffer);
  dv.setUint32(0, pxPerMeter); dv.setUint32(4, pxPerMeter); physData[8]=1; // unit=1 -> метры
  const chunk = buildPngChunk('pHYs', physData);
  const out = new Uint8Array(bytes.length+chunk.length);
  out.set(bytes.subarray(0,ihdrEnd),0);
  out.set(chunk, ihdrEnd);
  out.set(bytes.subarray(ihdrEnd), ihdrEnd+chunk.length);
  return new Blob([out], {type:'image/png'});
}

function exportPNG(dpi){
  const {sheet_w_mm:W,sheet_h_mm:H} = state.project;
  let pxPerMm = dpi/25.4;
  // У браузерных canvas есть практический потолок по стороне/памяти (обычно ~16384px
  // и/или ~2^28 пикселей суммарно); для крупной площадки на высоком DPI легко получить
  // холст на сотни мегабайт, и toBlob() тогда просто НИКОГДА не вызывает колбэк --
  // выглядит как "скачивание не работает", без единой ошибки в консоли. Поэтому клампим
  // разрешение заранее и явно предупреждаем, вместо тихого зависания.
  const MAX_DIM = 8000;
  const wantedW = W*pxPerMm, wantedH = H*pxPerMm;
  if(wantedW>MAX_DIM || wantedH>MAX_DIM){
    pxPerMm = Math.min(MAX_DIM/W, MAX_DIM/H);
    alert(`Площадка ${Math.round(W)}×${Math.round(H)} мм при ${dpi} DPI дала бы ${Math.round(wantedW)}×${Math.round(wantedH)} px -- браузер не потянет такой холст.\n`+
      `Разрешение снижено примерно до ${Math.round(pxPerMm*25.4)} DPI. Для печати крупной площадки в полном качестве используйте PDF (с разбивкой на листы) или SVG (вектор, без ограничения по размеру).`);
  }
  const cw = Math.max(1,Math.round(W*pxPerMm)), ch = Math.max(1,Math.round(H*pxPerMm));
  const off = document.createElement('canvas'); off.width=cw; off.height=ch;
  const octx = off.getContext('2d');
  const x0 = state.project.originCornerOffset.x, y0 = state.project.originCornerOffset.y;
  // временно подменяем ctx/view для переиспользования той же функции отрисовки объектов
  const savedCtx=ctx, savedView={...state.view};
  ctx = octx;
  state.view = { ox: -x0*pxPerMm, oy: ch + y0*pxPerMm, scale: pxPerMm };
  octx.fillStyle = CONFIG.colors.sheetBg; octx.fillRect(0,0,cw,ch);
  drawObjects();
  const problems = selfCheckMarkerRendering(octx, cw, ch, state.view, state.objects);
  ctx = savedCtx; state.view = savedView;
  if(problems.length){
    alert('Самопроверка перед экспортом PNG обнаружила испорченные метки (код на растре не совпадает со словарём):\n\n'+
      problems.map(p=>`ID ${p.markerId} (${p.dictionary}): ${p.mismatches}/${p.checked} ячеек не совпало`).join('\n')+
      '\n\nЭкспорт остановлен -- это баг рендера, а не площадки. Сохраните проект (.json) и сообщите об этом.');
    return;
  }
  off.toBlob(blob=>{
    if(!blob){ alert('Не удалось сформировать PNG -- вероятно, изображение всё ещё слишком большое для браузера. Попробуйте DPI пониже.'); return; }
    pngWithPhys(blob, pxPerMm).then(finalBlob=>{
      downloadBlob(finalBlob, (state.project.name||'map')+'_'+Math.round(pxPerMm*25.4)+'dpi.png', 'image/png');
    });
  });
}

/* ======================= EXPORT: карта дрона (.txt) ======================= */
function exportDroneMapTxt(){
  const {sheet_w_mm:W,sheet_h_mm:H} = state.project;
  const lines = [];
  lines.push(`# Карта ArUco: ${state.project.name}`);
  lines.push(`# Экспортировано редактором aruco_map_editor.html, ${new Date().toISOString().slice(0,19).replace('T',' ')}`);
  // Физический габарит площадки в метрах -- источник истины для проверки масштаба
  // экспортированных PNG/PDF независимо от их пиксельного/DPI округления: если
  // PNG получился не впритык к габариту (типично из-за quiet zone/полей), масштаб
  // всё равно можно восстановить точно как (ширина PNG в px) / sheet_w_m.
  lines.push(`# sheet_size_m: ${fmtNum(W/1000)} ${fmtNum(H/1000)}`);
  lines.push(`# id  length  x  y  z  rot_z  rot_y  rot_x`);
  for(const o of zOrdered()){
    if(o.type!=='marker' || o.hidden) continue;
    const lenM = o.size_mm/1000, xM=o.x_mm/1000, yM=o.y_mm/1000, zM=0;
    const rotZ = o.rot_deg*Math.PI/180;
    lines.push(`${o.markerId} ${fmtNum(lenM)} ${fmtNum(xM)} ${fmtNum(yM)} ${fmtNum(zM)} ${fmtNum(rotZ)} 0 0`);
  }
  downloadBlob(lines.join('\n')+'\n', (state.project.name||'map')+'.txt', 'text/plain');
}
function fmtNum(v){ return (Math.round(v*1e6)/1e6).toString(); }
function importDroneMapTxt(text, filename){
  const lines = text.split(/\r?\n/);
  const newObjs = [];
  for(const raw of lines){
    const line = raw.trim();
    if(!line || line.startsWith('#')) continue;
    const parts = line.split(/\s+/).map(Number);
    if(parts.length<8 || parts.some(isNaN)) continue;
    const [id,length,x,y,z,rotZ,rotY,rotX] = parts;
    const o = makeMarker(x*1000, y*1000);
    o.markerId = id; o.size_mm = length*1000; o.rot_deg = rotZ*180/Math.PI; o.z = topZ()+1;
    newObjs.push(o);
  }
  if(!newObjs.length){ alert('Не удалось найти ни одной строки метки в файле '+filename); return; }
  state.objects.push(...newObjs);
  state.selection = newObjs.map(o=>o.id);
  pushHistory(); refreshAll(); fitToView();
}

  downloadBlob(JSON.stringify(data,null,1), (state.project.name||'project')+'.json', 'application/json');
}
function importProjectJson(text){
  const data = JSON.parse(text);
  state.project = Object.assign(state.project, data.project||{});
  state.objects = data.objects||[];
  state.guides = data.guides||[];
  uidCounter = data.uidCounter || (Math.max(0,...state.objects.map(o=>o.id))+1);

/* Мини-схема раскладки по страницам в диалоге экспорта -- та же математика тайлинга
   (computePdfTiling/pdfTileRect), что и в реальном PDF, поэтому превью не врёт. */
function renderPdfPreview(canvas, infoEl, opts){
  const {sheet_w_mm:W, sheet_h_mm:H, originCornerOffset:corner} = state.project;
  const tiling = computePdfTiling({W,H,x0:corner.x,y0:corner.y,pageW:opts.pageW,pageH:opts.pageH,overlap:opts.overlap,center:opts.center});
  const totalW = opts.pageW+(tiling.nx-1)*(opts.pageW-opts.overlap);
  const totalH = opts.pageH+(tiling.ny-1)*(opts.pageH-opts.overlap);
  const cw = canvas.width, ch = canvas.height, pad=10;
  const scale = Math.min((cw-2*pad)/totalW, (ch-2*pad)/totalH);
  const ox = (cw-totalW*scale)/2, oy = (ch-totalH*scale)/2;
  const ctx2 = canvas.getContext('2d');
  ctx2.clearRect(0,0,cw,ch);
  ctx2.fillStyle = getCssVar('--bg3'); ctx2.fillRect(0,0,cw,ch);
  // страницы
  for(let iy=0; iy<tiling.ny; iy++){
    for(let ix=0; ix<tiling.nx; ix++){
      const px = ox + ix*(opts.pageW-opts.overlap)*scale;
      const py = oy + iy*(opts.pageH-opts.overlap)*scale;
      const pw = opts.pageW*scale, ph = opts.pageH*scale;
      ctx2.fillStyle = CONFIG.colors.sheetBg; ctx2.fillRect(px,py,pw,ph);
      ctx2.strokeStyle = '#888'; ctx2.lineWidth=1; ctx2.strokeRect(px+.5,py+.5,pw-1,ph-1);
      if(opts.overlap>0){
        ctx2.fillStyle='rgba(255,120,0,.25)';
        if(ix<tiling.nx-1) ctx2.fillRect(px+pw-opts.overlap*scale,py,opts.overlap*scale,ph);
        if(iy<tiling.ny-1) ctx2.fillRect(px,py+ph-opts.overlap*scale,pw,opts.overlap*scale);
      }
      ctx2.fillStyle='#333'; ctx2.font='9px sans-serif'; ctx2.textBaseline='top';
      ctx2.fillText(`${String.fromCharCode(65+ix)}${iy+1}`, px+3, py+3);
      if(ix===0 && iy===0 && opts.legendCorner){
        ctx2.fillStyle='rgba(76,154,255,.35)';
        const lw=pw*0.4, lh=ph*0.18;
        ctx2.fillRect(opts.legendCorner==='br'?px+pw-lw:px, py+ph-lh, lw, lh);
      }
    }
  }
  // площадка (рабочая зона) поверх сетки страниц -- контуром, чтобы было видно, как она
  // ложится на страницы. Перевод мировых мм в пиксели превью через ту же точку отсчёта
  // (startX0, topY), что и у самого тайлинга -- иначе рамка не совпадёт со страницами.
  const sx = ox + (corner.x - tiling.startX0)*scale;
  const sy = oy + (tiling.topY - (corner.y+H))*scale;
  ctx2.strokeStyle = CONFIG.colors.selection; ctx2.lineWidth=1.5;
  ctx2.strokeRect(sx, sy, W*scale, H*scale);
  infoEl.textContent = `${tiling.nx}×${tiling.ny} стр. (${tiling.nx*tiling.ny} шт.), лист ${pdfNum(opts.pageW)}×${pdfNum(opts.pageH)} мм`;
}

    <span class="close-x" id="modal-x">✕</span>
    <h3>${titleHtml}</h3>
    <div id="modal-body">${bodyHtml}</div>
    <div class="actions"><button class="secondary" id="modal-cancel">Отмена</button><button class="primary" id="modal-ok">${okLabel||'ОК'}</button></div>
  </div></div>`;
  function close(){ root.innerHTML=''; }
  $('#modal-x').addEventListener('click', close);
  $('#modal-cancel').addEventListener('click', close);
  $('#modal-ok').addEventListener('click', ()=>{ if(onOk(root)!==false) close(); });
  return root;
}

/* ======================= ИНСТРУМЕНТ «МАССИВ» (размножить NxM) ======================= */
function openArrayModal(){
  if(state.selection.length!==1){ alert('Выделите ровно один объект для размножения.'); return; }
  const src = getObj(state.selection[0]);
  const body = `
    ${propRow('По X (Nx)', `<input type="number" id="arr-nx" value="3" min="1">`)}
    ${propRow('По Y (Ny)', `<input type="number" id="arr-ny" value="1" min="1">`)}
    ${propRow('Шаг dx, мм', `<input type="number" id="arr-dx" value="${Math.round((src.size_mm||src.w_mm||100)*1.2)}">`)}
    ${propRow('Шаг dy, мм', `<input type="number" id="arr-dy" value="${Math.round((src.size_mm||src.h_mm||100)*1.2)}">`)}
    ${checkRow('автоинкремент ID', `id="arr-inc" ${src.type==='marker'?'checked':'disabled'}`)}
  `;
  showModal('Размножить по сетке', body, (root)=>{
    const nx = Math.max(1, parseInt(root.querySelector('#arr-nx').value)||1);
    const ny = Math.max(1, parseInt(root.querySelector('#arr-ny').value)||1);
    const dx = parseFloat(root.querySelector('#arr-dx').value)||0;
    const dy = parseFloat(root.querySelector('#arr-dy').value)||0;
    const inc = root.querySelector('#arr-inc').checked;
    const newIds=[];
    let n=0;
    for(let iy=0; iy<ny; iy++){
      for(let ix=0; ix<nx; ix++){
        if(ix===0 && iy===0){ newIds.push(src.id); n++; continue; } // сам исходник остаётся первой ячейкой
        const o = JSON.parse(JSON.stringify(src));
        o.id = nextUid(); o.x_mm = src.x_mm+ix*dx; o.y_mm = src.y_mm+iy*dy; o.z = topZ()+1;
        if(inc && o.type==='marker') o.markerId = src.markerId+n;
        state.objects.push(o); newIds.push(o.id); n++;
      }
    }
    state.selection = newIds;
    pushHistory(); refreshAll();
  });
}
$('#btn-array') && $('#btn-array').addEventListener('click', openArrayModal);

function init(){
  populateDefaultDictSelect();
  syncProjectUiFields();
  resizeCanvas();
  fitToView();
  pushHistory();
  refreshAll();
}
init();
