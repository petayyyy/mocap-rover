<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор карт ArUco</title>
<style>
/* ======================= БАЗОВЫЕ СТИЛИ ======================= */
:root{
  --bg:#1e1f22; --bg2:#26282c; --bg3:#2f3136; --panel:#2b2d31;
  --border:#3f4147; --text:#e3e5e8; --text-dim:#9a9ca3;
  --accent:#4c9aff; --accent-dim:#2c5d99; --danger:#e05252; --warn:#d9a441;
  --ok:#57b06a; --sheet-bg:#ffffff; --canvas-bg:#3a3c40;
  --handle:#4c9aff; --guide:#ff5fd8; --smart-guide:#ff3b3b;
}
:root[data-theme="light"]{
  --bg:#f3f4f6; --bg2:#e9eaee; --bg3:#ffffff; --panel:#ffffff;
  --border:#d0d2d8; --text:#1c1d1f; --text-dim:#6b6d75;
  --accent:#2563eb; --accent-dim:#c7d8fb; --canvas-bg:#c7c9cf;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:12px/1.4 -apple-system,Segoe UI,Arial,sans-serif;overflow:hidden;}
button,input,select{font:inherit;color:inherit;}
#app{display:flex;flex-direction:column;height:100vh;}

/* toolbar */
#toolbar{display:flex;align-items:center;gap:4px;padding:4px 8px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;
  min-height:34px;}
#toolbar .sep{width:1px;align-self:stretch;background:var(--border);margin:2px 4px;}
#toolbar button{background:var(--bg3);border:1px solid var(--border);
  border-radius:4px;padding:4px 8px;cursor:pointer;white-space:nowrap;}
#toolbar button:hover{background:var(--accent-dim);}
#toolbar button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
#toolbar label{display:flex;align-items:center;gap:3px;color:var(--text-dim);}
#toolbar input[type=number]{width:56px;background:var(--bg3);border:1px solid var(--border);
  border-radius:3px;padding:2px 4px;color:var(--text);}
#toolbar select{background:var(--bg3);border:1px solid var(--border);border-radius:3px;
  padding:2px 4px;}

/* main layout */
#main{flex:1;display:flex;min-height:0;}
#left-panel,#right-panel{width:270px;flex:none;background:var(--panel);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
#right-panel{border-right:none;border-left:1px solid var(--border);}
.panel-section{border-bottom:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
.panel-title{padding:6px 8px;font-weight:600;color:var(--text-dim);
  text-transform:uppercase;font-size:10px;letter-spacing:.04em;background:var(--bg2);
  display:flex;justify-content:space-between;align-items:center;}
.panel-title button{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:2px 4px;}
.panel-body{overflow:auto;padding:6px;}

#canvas-wrap{flex:1;position:relative;background:var(--canvas-bg);overflow:hidden;}
#stage{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:default;}
#stage.tool-pan{cursor:grab;}
#stage.panning{cursor:grabbing;}

/* layers list */
.layer-row{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:3px;cursor:default;
  user-select:none;}
.layer-row:hover{background:var(--bg2);}
.layer-row.sel{background:var(--accent-dim);}
.layer-row .lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.layer-row button{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:1px 3px;}
.layer-row.dragging{opacity:.4;}
.layer-row .drop-line{height:2px;background:var(--accent);}

/* properties -- метка НАД полем (не сбоку): в узкой панели это единственная раскладка,
   которая не отжимает поле ввода до нечитаемой ширины, когда рядом есть доп.элементы
   (чекбокс, подсказка диапазона и т.п.) */
.prop-row{display:flex;flex-direction:column;gap:3px;margin-bottom:7px;min-width:0;}
.prop-row>label{color:var(--text-dim);font-size:10.5px;}
.prop-row .prop-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;}
.prop-row input[type=text],.prop-row input[type=number],.prop-row select{
  flex:1 1 60px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;
  padding:4px 6px;color:var(--text);min-width:0;}
.prop-row input[type=checkbox]{margin:0;flex:none;}
.prop-row input[type=color]{width:36px;height:24px;padding:0;border:1px solid var(--border);
  background:none;border-radius:3px;flex:none;}
.prop-row .hint{color:var(--text-dim);font-size:10px;white-space:nowrap;flex:none;}
.prop-row .inline-check{display:flex;align-items:center;gap:3px;color:var(--text-dim);flex:none;white-space:nowrap;}
fieldset{border:1px solid var(--border);border-radius:4px;margin:0 0 8px;padding:6px;}
fieldset legend{color:var(--text-dim);font-size:10px;text-transform:uppercase;padding:0 4px;}
.btn-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
.btn-row button{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  padding:4px 6px;cursor:pointer;min-width:26px;}
.btn-row button:hover{background:var(--accent-dim);}

/* validation panel */
.issue{padding:4px 6px;border-radius:3px;margin-bottom:3px;cursor:pointer;font-size:11px;}
.issue:hover{outline:1px solid var(--accent);}
.issue.err{background:rgba(224,82,82,.15);border-left:3px solid var(--danger);}
.issue.warn{background:rgba(217,164,65,.15);border-left:3px solid var(--warn);}
.issue.ok{color:var(--ok);}

#statusbar{padding:2px 10px;background:var(--bg2);border-top:1px solid var(--border);
  color:var(--text-dim);display:flex;gap:16px;font-size:11px;min-height:20px;align-items:center;}
#statusbar span b{color:var(--text);}

/* modal dialogs */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;
  align-items:center;justify-content:center;z-index:1000;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:16px;min-width:320px;max-width:90vw;max-height:86vh;overflow:auto;
  box-shadow:0 8px 30px rgba(0,0,0,.4);}
.modal h3{margin:0 0 10px;}
.modal .close-x{float:right;cursor:pointer;color:var(--text-dim);}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
.modal button.primary{background:var(--accent);color:#fff;border:none;border-radius:4px;
  padding:6px 14px;cursor:pointer;}
.modal button.secondary{background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  padding:6px 14px;cursor:pointer;color:var(--text);}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

#dropzone-hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(76,154,255,.15);border:3px dashed var(--accent);z-index:50;font-size:20px;
  pointer-events:none;}
#dropzone-hint.show{display:flex;}
</style>
</head>
<body>
<div id="app">

  <div id="toolbar">
    <button id="tool-select" class="tool-btn active" data-tool="select" title="Выделение (V)">⇖ Выбор</button>
    <button id="tool-pan" class="tool-btn" data-tool="pan" title="Рука (пробел)">✋ Рука</button>
    <div class="sep"></div>
    <button id="add-marker" title="Добавить метку">▦ Метка</button>
    <button id="add-rect" title="Добавить прямоугольник">▭ Прямоуг.</button>
    <button id="add-circle" title="Добавить круг">◯ Круг</button>
    <button id="add-line" title="Добавить линию">╱ Линия</button>
    <button id="add-cross" title="Добавить крест">✚ Крест</button>
    <button id="add-text" title="Добавить текст">A Текст</button>
    <button id="add-image" title="Добавить изображение (подложку)">🖼 Картинка</button>
    <button id="btn-array" title="Размножить выделенный объект по сетке NxM">⊞ Массив</button>
    <div class="sep"></div>
    <button id="btn-copy" title="Копировать (Ctrl+C)">⧉ Копир.</button>
    <button id="btn-paste" title="Вставить (Ctrl+V)">📋 Вставить</button>
    <button id="btn-duplicate" title="Дублировать со смещением (Ctrl+D)">⎘ Дублир.</button>
    <div class="sep"></div>
    <button id="zoom-fit" title="Показать всё">⤢ Всё</button>
    <label>Zoom <span id="zoom-label">100%</span></label>
    <div class="sep"></div>
    <label><input type="checkbox" id="chk-grid" checked> сетка</label>
    <label><input type="checkbox" id="chk-subgrid" checked> подсетка</label>
    <label><input type="checkbox" id="chk-snap" checked> привязка</label>
    <label>шаг сетки <input type="number" id="grid-step" value="10" min="1" step="1"> мм</label>
    <div class="sep"></div>
    <label title="Размер рабочей площадки -- белый прямоугольник на холсте, он же итоговый размер поля в PDF/SVG/PNG">Площадка
      <input type="number" id="sheet-w" value="1000" min="1" step="10" style="width:64px"> ×
      <input type="number" id="sheet-h" value="1000" min="1" step="10" style="width:64px"> мм
    </label>
    <div class="sep"></div>
    <label title="Словарь по умолчанию -- назначается один раз здесь и подставляется во все новые метки автоматически">Словарь
      <select id="default-dict"></select>
    </label>
    <button id="btn-apply-dict-all" title="Применить выбранный словарь ко всем меткам на карте">⟳ ко всем меткам</button>
    <div class="sep"></div>
    <label>Ноль
      <select id="origin-mode">
        <option value="center">центр площадки</option>
        <option value="corner">левый нижний угол</option>
        <option value="object">по объекту...</option>
      </select>
    </label>
    <div class="sep"></div>
    <label>Единицы
      <select id="units-display"><option value="mm">мм</option><option value="cm">см</option><option value="m">м</option></select>
    </label>
    <button id="theme-toggle" title="Тема">◐ Тема</button>
    <div class="sep"></div>
    <button id="btn-undo" title="Отменить (Ctrl+Z)">↶</button>
    <button id="btn-redo" title="Повторить (Ctrl+Shift+Z)">↷</button>
    <div class="sep"></div>
    <button id="btn-project" title="Проект: новый/сохранить/открыть">📁 Проект</button>
    <button id="btn-import" title="Импорт карты дрона (.txt)">⇩ Импорт .txt</button>
    <button id="btn-export" title="Экспорт">⇧ Экспорт</button>
  </div>

  <div id="main">
    <aside id="left-panel">
      <div class="panel-section" style="flex:1;">
        <div class="panel-title">Слои (z-порядок)<button id="layers-help" title="Порядок отрисовки сверху вниз">?</button></div>
        <div class="panel-body" id="layers-list" style="flex:1;"></div>
      </div>
      <div class="panel-section" style="flex:0 0 auto;max-height:34%;">
        <div class="panel-title">Проблемы</div>
        <div class="panel-body" id="issues-list"></div>
      </div>
    </aside>

    <div id="canvas-wrap">
      <canvas id="stage"></canvas>
      <div id="dropzone-hint">Отпустите файл — .json проект или .txt карта дрона</div>
    </div>

    <aside id="right-panel">
      <div class="panel-section" style="flex:1;">
        <div class="panel-title">Свойства</div>
        <div class="panel-body" id="props-body"></div>
      </div>
    </aside>
  </div>

  <div id="statusbar">
    <span>Курсор: <b id="st-cursor">-, -</b></span>
    <span>Объектов: <b id="st-count">0</b></span>
    <span>Выделено: <b id="st-sel">0</b></span>
    <span id="st-msg" style="color:var(--accent-dim);"></span>
  </div>
</div>

<div id="modal-root"></div>

// hex-строка -> плоский Uint8Array бит (1=белая ячейка), длина n*n
function dictBits(dictName, id){
  const d = ARUCO_DICTS[dictName];
  if(!d || !d.codes[id]) return null;
  const n = d.n, total = n*n;
  const hex = d.codes[id];
  const val = BigInt('0x'+hex);
  const out = new Uint8Array(total);
  for(let i=0;i<total;i++){
    const shift = BigInt(total-1-i);
    out[i] = Number((val >> shift) & 1n);
  }
  return out; // out[r*n+c]
}

  whiteFieldAssist: null,   // {refId} -- активен инструмент "поставить в белое поле"
};

function getObj(id){ return state.objects.find(o=>o.id===id); }
function zOrdered(){ return state.objects.slice().sort((a,b)=>a.z-b.z); }
function topZ(){ return state.objects.reduce((m,o)=>Math.max(m,o.z), 0); }

/* ---- История (undo/redo) ---- */
const history = { undo:[], redo:[] };
function snapshot(){
  return JSON.stringify({objects:state.objects, selection:state.selection, guides:state.guides});
}
function pushHistory(){
  history.undo.push(snapshot());
  if(history.undo.length>CONFIG.historyLimit) history.undo.shift();
  history.redo.length = 0;
  updateUndoRedoButtons();
}
function restoreSnapshot(s){
  const d = JSON.parse(s);
  state.objects = d.objects; state.selection = d.selection; state.guides = d.guides;
}
function undo(){
  if(!history.undo.length) return;
  history.redo.push(snapshot());
  restoreSnapshot(history.undo.pop());
  updateUndoRedoButtons(); refreshAll();
}
function redo(){
  if(!history.redo.length) return;
  history.undo.push(snapshot());
  restoreSnapshot(history.redo.pop());
  updateUndoRedoButtons(); refreshAll();
}
function pasteClipboard(offsetMm){
  if(!state.clipboard.length) return;
  const newIds=[];
  for(const src of state.clipboard){
    const o = JSON.parse(JSON.stringify(src));
    o.id = nextUid(); o.x_mm += offsetMm; o.y_mm += offsetMm; o.z = topZ()+1;
    state.objects.push(o); newIds.push(o.id);
  }
  state.selection = newIds;
  pushHistory(); refreshAll();
}
function updateUndoRedoButtons(){
  $('#btn-undo').disabled = !history.undo.length;
  $('#btn-redo').disabled = !history.redo.length;
}

/* ======================= VIEW: трансформация мир<->экран ======================= */
const canvas = document.getElementById('stage');
let ctx = canvas.getContext('2d'); // let, не const: exportPNG временно подменяет на offscreen-контекст
let dpr = window.devicePixelRatio || 1;

function worldToScreen(x,y){
  return { x: state.view.ox + x*state.view.scale, y: state.view.oy - y*state.view.scale };
}
function screenToWorld(sx,sy){
  return { x: (sx-state.view.ox)/state.view.scale, y: (state.view.oy-sy)/state.view.scale };
}
function resizeCanvas(){
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  render();
}
function fitToView(){
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const pad = 40;
  const sw = state.project.sheet_w_mm, sh = state.project.sheet_h_mm;
  const scale = Math.min((w-2*pad)/sw, (h-2*pad)/sh);
  state.view.scale = Math.max(0.02, scale);
  // центр площадки (в системе координат площадки-мир) должен попасть в центр экрана
  const originScreenCenterX = w/2, originScreenCenterY = h/2;
  // world центр площадки зависит от originMode: считаем в "площадочных" координатах,
  // где (0,0) площадки = originOffset; см. sheetCenterWorld()
  const c = sheetCenterWorld();
  state.view.ox = originScreenCenterX - c.x*state.view.scale;
  state.view.oy = originScreenCenterY + c.y*state.view.scale;
  render();
}
function sheetCenterWorld(){
  const {sheet_w_mm:w, sheet_h_mm:h, originCornerOffset:c} = state.project;
  return {x:c.x+w/2, y:c.y+h/2};
}
/* Смена нуля координат: пересчитывает x_mm/y_mm ВСЕХ объектов и направляющих так,
   чтобы картинка на экране не сдвинулась, а поменялась только система отсчёта. */
function setOriginMode(newMode, refObjId){
  const {sheet_w_mm:w, sheet_h_mm:h, originCornerOffset:corner} = state.project;
  let newOriginOld;
  if(newMode==='corner') newOriginOld = {x:corner.x, y:corner.y};
  else if(newMode==='center') newOriginOld = {x:corner.x+w/2, y:corner.y+h/2};
  else if(newMode==='object'){
    const o = getObj(refObjId); if(!o) return false;
    newOriginOld = {x:o.x_mm, y:o.y_mm};
  } else return false;
  const delta = newOriginOld;
  for(const obj of state.objects){ obj.x_mm -= delta.x; obj.y_mm -= delta.y; }
  for(const g of state.guides){ if(g.axis==='x') g.pos_mm -= delta.x; else g.pos_mm -= delta.y; }
  state.project.originCornerOffset = {x:corner.x-delta.x, y:corner.y-delta.y};
  state.view.ox += delta.x*state.view.scale;
  state.view.oy -= delta.y*state.view.scale;
  state.project.originMode = newMode;
  state.project.originObjectId = newMode==='object'?refObjId:null;
  pushHistory(); refreshAll();
  return true;
}

/* ======================= РЕНДЕР ======================= */
function render(){
  const w = canvas.width, h = canvas.height;
  ctx.save();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const wCss = canvas.width/dpr, hCss = canvas.height/dpr;
  ctx.clearRect(0,0,wCss,hCss);
  ctx.fillStyle = getCssVar('--canvas-bg'); ctx.fillRect(0,0,wCss,hCss);

  drawSheet();
  if(state.ui.showGrid) drawGrid();
  drawObjects();
  drawWhiteFieldAssist();
  drawGuides();
  drawSelection();
  drawRulers();

  ctx.restore();
  updateStatusBar();
}
function getCssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function drawSheet(){
  const {sheet_w_mm:w, sheet_h_mm:h, originCornerOffset:c} = state.project;
  const x0=c.x, y0=c.y;
  const p1 = worldToScreen(x0,y0+h);
  const p2 = worldToScreen(x0+w,y0);
  ctx.fillStyle = CONFIG.colors.sheetBg;
  ctx.fillRect(p1.x,p1.y,p2.x-p1.x,p2.y-p1.y);
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth=1;
  ctx.strokeRect(p1.x+.5,p1.y+.5,p2.x-p1.x-1,p2.y-p1.y-1);
}

function drawGrid(){
  const step = state.project.gridStepMm;
  const wrap = document.getElementById('canvas-wrap');
  const wCss = wrap.clientWidth, hCss = wrap.clientHeight;
  const topLeft = screenToWorld(0,0), botRight = screenToWorld(wCss,hCss);
  const minX = Math.min(topLeft.x,botRight.x), maxX = Math.max(topLeft.x,botRight.x);
  const minY = Math.min(topLeft.y,botRight.y), maxY = Math.max(topLeft.y,botRight.y);

  function drawLines(spacing,color,widthPx){
    if(spacing*state.view.scale < 4) return; // слишком часто -- не рисуем
    ctx.strokeStyle = color; ctx.lineWidth = widthPx;
    ctx.beginPath();
    let startX = Math.floor(minX/spacing)*spacing;
    for(let x=startX; x<=maxX; x+=spacing){
      const p = worldToScreen(x,0);
      ctx.moveTo(Math.round(p.x)+.5,0); ctx.lineTo(Math.round(p.x)+.5,hCss);
    }
    let startY = Math.floor(minY/spacing)*spacing;
    for(let y=startY; y<=maxY; y+=spacing){
      const p = worldToScreen(0,y);
      ctx.moveTo(0,Math.round(p.y)+.5); ctx.lineTo(wCss,Math.round(p.y)+.5);
    }
    ctx.stroke();
  }
  if(state.ui.showSubgrid) drawLines(step/CONFIG.subgridDivisions, getCssVar('--border'), 1);
  drawLines(step, CONFIG.colors.gridMinor, 1);
  drawLines(step*5, CONFIG.colors.gridMajor, 1);
  // оси
  ctx.strokeStyle='rgba(255,80,80,.6)'; ctx.lineWidth=1.5;
  const ax = worldToScreen(0,0);
  ctx.beginPath(); ctx.moveTo(0,ax.y); ctx.lineTo(wCss,ax.y); ctx.stroke();
  ctx.strokeStyle='rgba(80,200,80,.6)';
  ctx.beginPath(); ctx.moveTo(ax.x,0); ctx.lineTo(ax.x,hCss); ctx.stroke();
}

/* ---- Растровый кэш кода метки (по словарю+id+инверсии+рамке) ----
   Раньше код метки рисовался поячейково через отдельные fillRect() (с ручным
   нахлёстом +0.4мм "против щелей"). Каждый fillRect в canvas сглаживается
   НЕЗАВИСИМО от соседних, а нахлёст в мм эффективен только на какой-то одной
   шкале зума -- при отдалении/увеличении (и на PNG-экспорте с другим DPI) он
   либо избыточен, либо недостаточен, и на стыках ячеек остаются волосяные
   полосы. Правильное решение -- отрисовать весь код метки ОДИН раз в offscreen
   canvas на достаточно мелкой пиксельной сетке (без дробных координат, значит
   без сглаживания на внутренних стыках вообще), закэшировать этот битмап и
   дальше просто растягивать его одним drawImage() с отключённым сглаживанием
   (чёткие грани при любом масштабе, как у настоящей печатной метки). PDF/SVG
   это не затрагивает -- там объекты и так честный вектор без этой проблемы. */
const markerBitmapCache = new Map();
const MARKER_BITMAP_PX_PER_CELL = 16;
function getMarkerBitmap(o){
  const key = o.dictionary+'|'+o.markerId+'|'+(o.invert?1:0)+'|'+o.border_bits;
  let entry = markerBitmapCache.get(key);
  if(entry) return entry;
  const dictMeta = ARUCO_DICTS[o.dictionary];
  const n = dictMeta ? dictMeta.n : 4;
  const nb = o.border_bits;
  const total = n+2*nb;
  const bits = dictBits(o.dictionary, o.markerId);
  const PXC = MARKER_BITMAP_PX_PER_CELL;
  const side = total*PXC;
  const cvs = document.createElement('canvas'); cvs.width=side; cvs.height=side;
  const c2 = cvs.getContext('2d');
  const blackC = o.invert?'#ffffff':'#000000', whiteC = o.invert?'#000000':'#ffffff';
  c2.fillStyle = blackC; c2.fillRect(0,0,side,side); // весь квадрат чёрный: и фон, и рамка разом
  if(bits){
    c2.fillStyle = whiteC;
    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        if(!bits[r*n+c]) continue;
        // ВАЖНО (проверено вживую детектором cv2.aruco -- см. коммит-сообщение):
        // r=0 в bits -- ВЕРХНИЙ ряд метки (так её отдаёт сам OpenCV при генерации,
        // gen_dicts.py читает строки изображения сверху вниз). Картинка здесь тоже
        // рисуется сверху вниз, поэтому r отображается НАПРЯМУЮ в номер строки
        // пикселей, без переворота -- drawImageObj-подобный double-flip (ctx.scale(1,-1)
        // в drawMarkerObj поверх applyWorldTransform) уже сам всё компенсирует.
        // Переворот строк здесь (как было раньше) даёт зеркальную по вертикали,
        // НЕДЕТЕКТИРУЕМУЮ метку -- поймано и подтверждено round-trip тестом с реальным
        // cv2.aruco.detectMarkers на экспортированном PNG.
        const pixelRow = nb+r;
        c2.fillRect((nb+c)*PXC, pixelRow*PXC, PXC, PXC);
      }
    }
  }
  entry = { canvas:cvs, hasBits:!!bits };
  markerBitmapCache.set(key, entry);
  return entry;
}

/* Отрисовка одной метки (код -- закэшированный битмап, quiet zone -- вектор) */
function drawMarkerObj(o){
  const half = o.size_mm/2;
  ctx.save();
  applyWorldTransform(o.x_mm,o.y_mm,o.rot_deg);
  // quiet zone (белое поле)
  if(o.quiet_zone_mm>0){
    ctx.fillStyle = o.invert?CONFIG.colors.markerBlack:CONFIG.colors.markerWhite;
    const qz = o.size_mm/2 + o.quiet_zone_mm;
    ctx.fillRect(-qz,-qz,qz*2,qz*2);
  }
  const bmp = getMarkerBitmap(o);
  if(bmp.hasBits){
    ctx.imageSmoothingEnabled = false;
    ctx.scale(1,-1); // та же схема, что и для image-объектов -- см. drawImageObj
    ctx.drawImage(bmp.canvas, -half, -half, o.size_mm, o.size_mm);
  } else {
    ctx.fillStyle = '#ff0000'; ctx.font = (o.size_mm*0.15)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    drawFlippedText('нет метки', 0,0, o.size_mm*0.12);
  }
  ctx.restore();
}
// Применяет трансформацию: сдвиг к (x,y), поворот на rot_deg (CCW, мир) -- локальные координаты после этого в мм
function applyWorldTransform(x,y,rotDeg){
  const p = worldToScreen(x,y);
  ctx.translate(p.x,p.y);
  ctx.scale(state.view.scale, -state.view.scale); // локальная система теперь в мм, Y вверх
  ctx.rotate(rotDeg*Math.PI/180);
}
// Текст рисуем с дополнительным flip, чтобы буквы не были зеркальными (см. обоснование в шапке)
function drawFlippedText(str,x,y,sizeMm,opts){
  opts = opts||{};
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(1,-1);
  ctx.font = (opts.bold?'bold ':'')+sizeMm+'px '+(opts.font||'Arial');
  ctx.fillStyle = opts.color||'#000';
  ctx.textAlign = opts.align||'center';
  ctx.textBaseline = opts.baseline||'middle';
  ctx.fillText(str,0,0);
  ctx.restore();
}

function drawShapeObj(o){
  ctx.save();
  applyWorldTransform(o.x_mm,o.y_mm,o.rot_deg);
  ctx.lineWidth = o.strokeWidth_mm;
  ctx.strokeStyle = o.stroke; ctx.fillStyle = o.fill;
  const w=o.w_mm,h=o.h_mm;
  if(o.shape==='rect'){
    if(o.fill!=='none'){ ctx.fillRect(-w/2,-h/2,w,h); }
    if(o.strokeWidth_mm>0) ctx.strokeRect(-w/2,-h/2,w,h);
  } else if(o.shape==='circle'){
    ctx.beginPath(); ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);
    if(o.fill!=='none') ctx.fill();
    if(o.strokeWidth_mm>0) ctx.stroke();
  } else if(o.shape==='line'){
    ctx.beginPath(); ctx.moveTo(-w/2,0); ctx.lineTo(w/2,0); ctx.stroke();
  } else if(o.shape==='cross'){
    const t=Math.min(w,h)*0.2;
    ctx.beginPath();
    ctx.moveTo(-w/2,-t/2); ctx.lineTo(-t/2,-t/2); ctx.lineTo(-t/2,-h/2); ctx.lineTo(t/2,-h/2);
    ctx.lineTo(t/2,-t/2); ctx.lineTo(w/2,-t/2); ctx.lineTo(w/2,t/2); ctx.lineTo(t/2,t/2);
    ctx.lineTo(t/2,h/2); ctx.lineTo(-t/2,h/2); ctx.lineTo(-t/2,t/2); ctx.lineTo(-w/2,t/2);
    ctx.closePath();
    if(o.fill!=='none') ctx.fill();
    if(o.strokeWidth_mm>0) ctx.stroke();
  }
  ctx.restore();
}
function drawTextObj(o){
  drawWithTransformThenText(o);
}
function drawWithTransformThenText(o){
  ctx.save();
  applyWorldTransform(o.x_mm,o.y_mm,o.rot_deg);
  drawFlippedText(o.text,0,0,o.size_mm,{color:o.color,font:o.font,align:'left',baseline:'alphabetic'});
  ctx.restore();
}
const imageCache = new Map();
function drawImageObj(o){
  if(!o.src) return;
  let img = imageCache.get(o.id);
  if(!img){
    img = new Image();
    img.onload = ()=>render();
    img.src = o.src;
    imageCache.set(o.id,img);
  }
  if(!img.complete || !img.naturalWidth) return;
  ctx.save();
  applyWorldTransform(o.x_mm,o.y_mm,o.rot_deg);
  ctx.globalAlpha = o.opacity;
  ctx.scale(1,-1);
  ctx.drawImage(img,-o.w_mm/2,-o.h_mm/2,o.w_mm,o.h_mm);
  ctx.restore();
}

function drawObjects(){
  for(const o of zOrdered()){
    if(o.hidden) continue;
    if(o.type==='marker') drawMarkerObj(o);
    else if(o.type==='shape') drawShapeObj(o);
    else if(o.type==='text') drawTextObj(o);
    else if(o.type==='image') drawImageObj(o);
  }
}

/* Инструмент «поставить в белое поле»: подсветка безопасной зоны вокруг опорной метки
   (сама метка + quiet zone запретны; область снаружи -- безопасна и подсвечивается) и
   выталкивание вновь размещаемой/перетаскиваемой метки из запретной зоны наружу. */
function drawWhiteFieldAssist(){
  if(!state.whiteFieldAssist) return;
  const ref = getObj(state.whiteFieldAssist.refId); if(!ref) return;
  const forbiddenHalf = ref.size_mm/2 + ref.quiet_zone_mm;
  const safeHalf = forbiddenHalf + Math.max(30, ref.quiet_zone_mm*3);
  const outer = boxPolygon(ref, safeHalf).map(p=>worldToScreen(p.x,p.y));
  const inner = boxPolygon(ref, forbiddenHalf).map(p=>worldToScreen(p.x,p.y));
  ctx.save();
  ctx.fillStyle='rgba(87,176,106,.22)'; ctx.strokeStyle='rgba(87,176,106,.9)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  outer.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath();
  inner.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath();
  ctx.fill('evenodd');
  ctx.beginPath(); outer.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.stroke();
  ctx.strokeStyle='rgba(224,82,82,.9)';
  ctx.beginPath(); inner.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.stroke();
  ctx.restore();
}
// Выталкивает точку (x,y) -- предполагаемый центр метки obj -- за пределы запретной
// зоны опорной метки, к ближайшей стороне.
function applyWhiteFieldAssist(objLike, x, y){
  if(!state.whiteFieldAssist) return {x,y};
  const ref = getObj(state.whiteFieldAssist.refId);
  if(!ref || ref===objLike || ref.id===objLike.id) return {x,y};
  const objHalf = objLike.type==='marker' ? objLike.size_mm/2+objLike.quiet_zone_mm : Math.max(objLike.w_mm||20,objLike.h_mm||20)/2;
  const refOuter = ref.size_mm/2+ref.quiet_zone_mm;
  const minDist = refOuter+objHalf;
  const rad = ref.rot_deg*Math.PI/180;
  const rel = rotateVec(x-ref.x_mm, y-ref.y_mm, -rad);
  if(Math.abs(rel.x)>=minDist || Math.abs(rel.y)>=minDist) return {x,y};
  const overX = minDist-Math.abs(rel.x), overY = minDist-Math.abs(rel.y);
  if(overX<overY) rel.x = (rel.x<0?-1:1)*minDist; else rel.y = (rel.y<0?-1:1)*minDist;
  const back = rotateVec(rel.x, rel.y, rad);
  return {x: ref.x_mm+back.x, y: ref.y_mm+back.y};
}
function drawGuides(){
  const wrap = document.getElementById('canvas-wrap');
  const wCss = wrap.clientWidth, hCss = wrap.clientHeight;
  ctx.strokeStyle = CONFIG.colors.guide; ctx.lineWidth=1;
  ctx.setLineDash([4,3]);
  for(const g of state.guides){
    ctx.beginPath();
    if(g.axis==='x'){ const p=worldToScreen(g.pos_mm,0); ctx.moveTo(p.x,0); ctx.lineTo(p.x,hCss); }
    else { const p=worldToScreen(0,g.pos_mm); ctx.moveTo(0,p.y); ctx.lineTo(wCss,p.y); }
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

/* ---- Геометрия объекта в его собственной (локальной, неповёрнутой) системе ----
   Каждый объект хранит "опорную" точку (x_mm,y_mm): для marker/shape/image это
   геометрический ЦЕНТР, для text -- точка привязки текста (левый край базовой линии).
   localAnchorOffset -- смещение геометрического центра от опорной точки (в местных,
   неповёрнутых осях). localHalfExtents -- половина габарита относительно ЦЕНТРА.
   Эти две функции -- единственное место, которое знает форму каждого типа объектов;
   всё остальное (рамка выделения, ручки, resize, rotate) работает через них обобщённо. */
function textWidthMm(o){ return Math.max(20, (o.text||'').length*o.size_mm*0.6); }
function localAnchorOffset(o){
  if(o.type==='text'){ return {cx:textWidthMm(o)/2, cy:o.size_mm*0.455}; }
  return {cx:0,cy:0};
}
function localHalfExtents(o){
  if(o.type==='marker'){ const s=o.size_mm/2+o.quiet_zone_mm; return {hw:s,hh:s}; }
  if(o.type==='text'){ const hhFull=o.size_mm*0.65; return {hw:textWidthMm(o)/2, hh:hhFull*0.9}; }
  return {hw:o.w_mm/2, hh:o.h_mm/2}; // shape, image
}
function rotateVec(x,y,rad){ const c=Math.cos(rad),s=Math.sin(rad); return {x:x*c-y*s, y:x*s+y*c}; }
// Точка в местных координатах объекта (относительно его опорной x_mm,y_mm) -> мир.
// rotRad/anchor можно переопределить (используется при live-перетаскивании ручек).
function worldFromLocal(o, lx, ly, rotRad, anchor){
  const rot = rotRad!==undefined ? rotRad : o.rot_deg*Math.PI/180;
  const ax = anchor?anchor.x:o.x_mm, ay = anchor?anchor.y:o.y_mm;
  const r = rotateVec(lx,ly,rot);
  return {x:ax+r.x, y:ay+r.y};
}
function objCenterWorld(o){ const {cx,cy}=localAnchorOffset(o); return worldFromLocal(o,cx,cy); }
function objBoundsWorld(o){
  const {cx,cy} = localAnchorOffset(o);
  const {hw,hh} = localHalfExtents(o);
  return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([dx,dy])=>worldFromLocal(o,cx+dx,cy+dy));
}

/* ---- Ручки выделения (8 resize + 1 rotate) ---- */
const HANDLE_DEFS = [
  {id:'tl', lx:-1, ly:1,  edge:false},
  {id:'t',  lx:0,  ly:1,  edge:true, axis:'y'},
  {id:'tr', lx:1,  ly:1,  edge:false},
  {id:'r',  lx:1,  ly:0,  edge:true, axis:'x'},
  {id:'br', lx:1,  ly:-1, edge:false},
  {id:'b',  lx:0,  ly:-1, edge:true, axis:'y'},
  {id:'bl', lx:-1, ly:-1, edge:false},
  {id:'l',  lx:-1, ly:0,  edge:true, axis:'x'},
];
function oppositeHandle(h){ return {lx:-h.lx, ly:-h.ly, edge:h.edge, axis:h.axis}; }
function handleWorldPos(o, h){
  const {cx,cy} = localAnchorOffset(o); const {hw,hh} = localHalfExtents(o);
  return worldFromLocal(o, cx+h.lx*hw, cy+h.ly*hh);
}
function rotateHandleWorldPos(o){
  const {cx,cy} = localAnchorOffset(o); const {hh} = localHalfExtents(o);
  const offMm = CONFIG.rotateHandleOffsetPx/state.view.scale;
  return worldFromLocal(o, cx, cy+hh+offMm);
}

function drawSelection(){
  const single = state.selection.length===1 ? getObj(state.selection[0]) : null;
  for(const id of state.selection){
    const o = getObj(id); if(!o) continue;
    const pts = objBoundsWorld(o).map(p=>worldToScreen(p.x,p.y));
    ctx.strokeStyle = CONFIG.colors.selection; ctx.lineWidth=1.5;
    ctx.beginPath();
    pts.forEach((p,i)=> i? ctx.lineTo(p.x,p.y): ctx.moveTo(p.x,p.y));
    ctx.closePath(); ctx.stroke();
  }
  if(single && !single.locked){
    const hs = CONFIG.handleSizePx;
    ctx.fillStyle='#fff'; ctx.strokeStyle=CONFIG.colors.selection; ctx.lineWidth=1.5;
    for(const h of HANDLE_DEFS){
      const p = worldToScreen2(handleWorldPos(single,h));
      ctx.beginPath(); ctx.rect(p.x-hs/2,p.y-hs/2,hs,hs); ctx.fill(); ctx.stroke();
    }
    // ручка поворота + соединительная линия от верхней грани
    const topMid = worldToScreen2(handleWorldPos(single,{lx:0,ly:1}));
    const rp = worldToScreen2(rotateHandleWorldPos(single));
    ctx.beginPath(); ctx.moveTo(topMid.x,topMid.y); ctx.lineTo(rp.x,rp.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(rp.x,rp.y,hs/2+1,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke();
  }
}
function worldToScreen2(p){ return worldToScreen(p.x,p.y); }

function drawRulers(){
  // Полосы линеек поверх краёв канваса (не часть мир-пространства)
  const wrap = document.getElementById('canvas-wrap');
  const wCss = wrap.clientWidth, hCss = wrap.clientHeight;
  const RS = 18;
  ctx.fillStyle = getCssVar('--bg2');
  ctx.fillRect(0,0,wCss,RS);
  ctx.fillRect(0,0,RS,hCss);
  ctx.strokeStyle = getCssVar('--border');
  ctx.strokeRect(0.5,0.5,wCss-1,RS-1);
  ctx.fillStyle = getCssVar('--text-dim');
  ctx.font='9px sans-serif'; ctx.textBaseline='top';
  const step = niceRulerStep();
  const topLeft = screenToWorld(RS,0), botRight = screenToWorld(wCss,hCss);
  let startX = Math.floor(topLeft.x/step)*step;
  for(let x=startX; x<=botRight.x; x+=step){
    const p = worldToScreen(x,0);
    if(p.x<RS) continue;
    ctx.beginPath(); ctx.moveTo(p.x+.5,RS-6); ctx.lineTo(p.x+.5,RS); ctx.strokeStyle=getCssVar('--text-dim'); ctx.stroke();
    ctx.fillText(fmtLen(x), p.x+2, 2);
  }
  ctx.save();
  ctx.translate(0,0);
  let startY = Math.floor(screenToWorld(0,RS).y/step)*step;
  const botY = screenToWorld(0,hCss).y;
  for(let y=startY; y>=botY; y-=step){
    const p = worldToScreen(0,y);
    if(p.y<RS) continue;
    ctx.beginPath(); ctx.moveTo(RS-6,p.y+.5); ctx.lineTo(RS,p.y+.5); ctx.stroke();
    ctx.save(); ctx.translate(1,p.y+2); ctx.rotate(-Math.PI/2); ctx.fillText(fmtLen(y),0,0); ctx.restore();
  }
  ctx.restore();
}
function niceRulerStep(){
  const target=60; // px
  let mmPerPx = 1/state.view.scale;
  let raw = target*mmPerPx;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw/pow;
  let mult = n<2?1:(n<5?2:5);
  return mult*pow;
}
function fmtMm(v){ return Math.round(v*100)/100 + ''; }
const UNIT_SUFFIX = {mm:'мм', cm:'см', m:'м'}, UNIT_DIV = {mm:1, cm:10, m:1000};
function fmtLen(vMm){
  const u = state.project.unitsDisplay||'mm';
  const div = UNIT_DIV[u];
  const digits = u==='m'?3:(u==='cm'?2:2);
  return (Math.round(vMm/div*Math.pow(10,digits))/Math.pow(10,digits)) + ' ' + UNIT_SUFFIX[u];
}

function bumpZ(o, dir){
  const ordered = zOrdered(); const idx = ordered.findIndex(x=>x.id===o.id);
  const swapIdx = idx+dir; // dir>0 => "выше" по слою = больше z = позже в zOrdered
  if(swapIdx<0||swapIdx>=ordered.length) return;
  const other = ordered[swapIdx];
  const tmp=o.z; o.z=other.z; other.z=tmp;
  pushHistory(); refreshAll();
}
function reorderLayer(draggedId, targetId){
  // список сверху вниз (визуальный, ordered.reverse()); перетаскивание -- вставить перед target
  const ordered = zOrdered().reverse(); // индекс0 = самый верхний z
  const from = ordered.findIndex(o=>o.id===draggedId);
  const to = ordered.findIndex(o=>o.id===targetId);
  if(from<0||to<0) return;
  const [item] = ordered.splice(from,1);
  ordered.splice(to,0,item);
  // переприсваиваем z по новому порядку (верх списка = наибольший z)
  const n = ordered.length;
  ordered.forEach((o,i)=>{ o.z = n-i; });
  pushHistory(); refreshAll();
}

function alignObjects(objs, mode){
  const boxes = objs.map(o=>({o, pts:objBoundsWorld(o)}));
  const bx = boxes.map(b=>({minX:Math.min(...b.pts.map(p=>p.x)), maxX:Math.max(...b.pts.map(p=>p.x)),
    minY:Math.min(...b.pts.map(p=>p.y)), maxY:Math.max(...b.pts.map(p=>p.y)), o:b.o}));
  const gMinX=Math.min(...bx.map(b=>b.minX)), gMaxX=Math.max(...bx.map(b=>b.maxX));
  const gMinY=Math.min(...bx.map(b=>b.minY)), gMaxY=Math.max(...bx.map(b=>b.maxY));
  function moveBy(o,dx,dy){ o.x_mm+=dx; o.y_mm+=dy; }
  if(mode==='left') bx.forEach(b=>moveBy(b.o, gMinX-b.minX, 0));
  else if(mode==='right') bx.forEach(b=>moveBy(b.o, gMaxX-b.maxX, 0));
  else if(mode==='hcenter'){ const c=(gMinX+gMaxX)/2; bx.forEach(b=>moveBy(b.o, c-(b.minX+b.maxX)/2, 0)); }
  else if(mode==='top') bx.forEach(b=>moveBy(b.o, 0, gMaxY-b.maxY));
  else if(mode==='bottom') bx.forEach(b=>moveBy(b.o, 0, gMinY-b.minY));
  else if(mode==='vcenter'){ const c=(gMinY+gMaxY)/2; bx.forEach(b=>moveBy(b.o, 0, c-(b.minY+b.maxY)/2)); }
  else if(mode==='hdist' && bx.length>2){
    bx.sort((a,b)=>a.minX-b.minX);
    const total = gMaxX-gMinX, sumW = bx.reduce((s,b)=>s+(b.maxX-b.minX),0);
    const gap = (total-sumW)/(bx.length-1);
    let cursor=gMinX;
    for(const b of bx){ moveBy(b.o, cursor-b.minX, 0); cursor += (b.maxX-b.minX)+gap; }
  } else if(mode==='vdist' && bx.length>2){
    bx.sort((a,b)=>a.minY-b.minY);
    const total = gMaxY-gMinY, sumH = bx.reduce((s,b)=>s+(b.maxY-b.minY),0);
    const gap = (total-sumH)/(bx.length-1);
    let cursor=gMinY;
    for(const b of bx){ moveBy(b.o, cursor-b.minY, 0); cursor += (b.maxY-b.minY)+gap; }
  }
  pushHistory(); refreshAll();
}

/* ======================= ВАЛИДАЦИЯ ======================= */
/* ---- Геометрия для проверки перекрытий: Сазерленд-Ходжман по выпуклым 4-угольникам ---- */
function polyCross(A,B,P){ return (B.x-A.x)*(P.y-A.y)-(B.y-A.y)*(P.x-A.x); }
function clipPolygon(subject, clip){
  let output = subject;
  for(let i=0;i<clip.length && output.length;i++){
    const A=clip[i], B=clip[(i+1)%clip.length];
    const input = output; output=[];
    for(let j=0;j<input.length;j++){
      const P=input[j], Q=input[(j+1)%input.length];
      const sideP = polyCross(A,B,P), sideQ = polyCross(A,B,Q);
      if(sideP>=-1e-9) output.push(P);
      if((sideP>=-1e-9)!==(sideQ>=-1e-9)){
        const t = sideP/(sideP-sideQ);
        output.push({x:P.x+t*(Q.x-P.x), y:P.y+t*(Q.y-P.y)});
      }
    }
  }
  return output;
}
function polygonArea(pts){
  let a=0; for(let i=0;i<pts.length;i++){ const j=(i+1)%pts.length; a += pts[i].x*pts[j].y - pts[j].x*pts[i].y; }
  return Math.abs(a)/2;
}
function boxPolygon(o, halfSize){
  return [[-halfSize,-halfSize],[halfSize,-halfSize],[halfSize,halfSize],[-halfSize,halfSize]].map(([dx,dy])=>worldFromLocal(o,dx,dy));
}
function markerCellPolygon(o,r,c,n,nb,cell,half){
  // r=0 в bits -- верхний ряд метки (см. drawMarkerObj/getMarkerBitmap), в локальной
  // системе координат (+Y вверх) это соответствует НАИБОЛЬШЕМУ Y, поэтому строка
  // переворачивается: nb+(n-1-r), а не nb+r.
  const lx0=-half+cell*(nb+c), ly0=-half+cell*(nb+(n-1-r));
  return [[lx0,ly0],[lx0+cell,ly0],[lx0+cell,ly0+cell],[lx0,ly0+cell]].map(([dx,dy])=>worldFromLocal(o,dx,dy));
}
/* ---- Валидатор вложенных меток: сколько ячеек испорчено объектами сверху ---- */
function analyzeNestedMarker(o){
  const dictMeta = ARUCO_DICTS[o.dictionary]; if(!dictMeta) return null;
  const n=dictMeta.n, nb=o.border_bits, total=n+2*nb, cell=o.size_mm/total;
  const half=o.size_mm/2, innerHalf=half-nb*cell, outerHalf=half+o.quiet_zone_mm;
  const outerBox=boxPolygon(o,outerHalf), blackBox=boxPolygon(o,half), innerBox=boxPolygon(o,innerHalf);
  const above = state.objects.filter(x=>x.id!==o.id && !x.hidden && x.z>o.z);
  const aboveBoxes = above.map(x=>objBoundsWorld(x));
  let frameHit=false;
  for(const otherPoly of aboveBoxes){
    const qzClip = clipPolygon(otherPoly, outerBox); if(!qzClip.length) continue;
    const qzArea = polygonArea(qzClip);
    const blackClip = clipPolygon(qzClip, blackBox);
    const blackArea = blackClip.length?polygonArea(blackClip):0;
    if(qzArea-blackArea>0.5) frameHit=true;
    if(blackClip.length){
      const innerClip = clipPolygon(blackClip, innerBox);
      const innerArea = innerClip.length?polygonArea(innerClip):0;
      if(blackArea-innerArea>0.5) frameHit=true;
    }
  }
  let spoiled=0;
  const cellArea = cell*cell;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const cellPoly = markerCellPolygon(o,r,c,n,nb,cell,half);
    let covered=0;
    for(const otherPoly of aboveBoxes){
      const clip = clipPolygon(cellPoly, otherPoly);
      if(clip.length) covered += polygonArea(clip);
    }
    if(Math.min(cellArea,covered)/cellArea > 0.5) spoiled++;
  }
  const qzTooNarrow = o.quiet_zone_mm < cell;
  return { total:n*n, spoiled, budget:dictMeta.mcb, frameHit, qzTooNarrow, cellMm:cell };
}

/* ---- Общая валидация проекта: список проблем в правой панели ---- */
function boxesOverlap(a,b){
  const pa=objBoundsWorld(a), pb=objBoundsWorld(b);
  const ba=bboxOf(pa), bb=bboxOf(pb);
  if(ba.maxX<bb.minX || bb.maxX<ba.minX || ba.maxY<bb.minY || bb.maxY<ba.minY) return false; // дешёвый AABB-отсев
  const clip = clipPolygon(pa,pb);
  return clip.length>0 && polygonArea(clip)>0.25;
}
function sheetBoxWorld(){
  const {sheet_w_mm:w,sheet_h_mm:h,originCornerOffset:c}=state.project;
  return {x0:c.x,y0:c.y,x1:c.x+w,y1:c.y+h};
}
function computeIssues(){
  const issues = []; // {sev:'err'|'warn', text, objIds:[]}
  const sheet = sheetBoxWorld();
  const markers = state.objects.filter(o=>o.type==='marker');
  // 1. дубликаты id в пределах словаря
  const byDict = {};
  for(const m of markers){ (byDict[m.dictionary]=byDict[m.dictionary]||[]).push(m); }
  for(const dict in byDict){
    const seen = {};
    for(const m of byDict[dict]){ (seen[m.markerId]=seen[m.markerId]||[]).push(m); }
    for(const id in seen){
      if(seen[id].length>1) issues.push({sev:'err', text:`Дублирующийся ID ${id} в словаре ${dict} (${seen[id].length} меток)`, objIds:seen[id].map(m=>m.id)});
    }
  }
  // 2. id вне диапазона словаря
  for(const m of markers){
    const meta = ARUCO_DICTS[m.dictionary];
    if(!meta || m.markerId<0 || m.markerId>=meta.codes.length){
      issues.push({sev:'err', text:`ID ${m.markerId} вне диапазона словаря ${m.dictionary} (макс. ${meta?meta.codes.length-1:'?'})`, objIds:[m.id]});
    }
  }
  // 3. выход за границу площадки/листа
  for(const o of state.objects){
    if(o.hidden) continue;
    const pts = objBoundsWorld(o);
    const out = pts.some(p=>p.x<sheet.x0||p.x>sheet.x1||p.y<sheet.y0||p.y>sheet.y1);
    if(out) issues.push({sev:'warn', text:`${objLabel(o)} выходит за границу площадки`, objIds:[o.id]});
  }
  // 4. пересечения меток без пометки intentionalNested (сперва дешёвый AABB-отсев, чтобы
  // не гонять полигональный клиппинг на каждой паре -- важно при 200+ метках)
  const markerBoxes = markers.map(m=>bboxOf(objBoundsWorld(m)));
  for(let i=0;i<markers.length;i++){
    const a=markers[i]; if(a.hidden||a.intentionalNested) continue;
    for(let j=i+1;j<markers.length;j++){
      const b=markers[j];
      if(b.hidden||b.intentionalNested) continue;
      const ba=markerBoxes[i], bb=markerBoxes[j];
      if(ba.maxX<bb.minX || bb.maxX<ba.minX || ba.maxY<bb.minY || bb.maxY<ba.minY) continue;
      const clip = clipPolygon(objBoundsWorld(a), objBoundsWorld(b));
      if(clip.length>0 && polygonArea(clip)>0.25) issues.push({sev:'warn', text:`${objLabel(a)} и ${objLabel(b)} пересекаются (не помечено как вложенность)`, objIds:[a.id,b.id]});
    }
  }
  // 5. метка меньше минимального размера
  for(const m of markers){
    if(m.size_mm < state.project.minMarkerSizeMm) issues.push({sev:'warn', text:`${objLabel(m)} меньше минимального размера (${m.size_mm} < ${state.project.minMarkerSizeMm} мм)`, objIds:[m.id]});
  }
  // 6. слишком узкая quiet zone
  for(const m of markers){
    const meta = ARUCO_DICTS[m.dictionary]; if(!meta) continue;
    const cell = m.size_mm/(meta.n+2*m.border_bits);
    if(m.quiet_zone_mm < cell) issues.push({sev:'warn', text:`${objLabel(m)}: quiet zone (${round2(m.quiet_zone_mm)} мм) меньше одной ячейки (${round2(cell)} мм) — детекция деградирует`, objIds:[m.id]});
  }
  return issues;
}
function renderIssues(){
  const el = $('#issues-list');
  const issues = computeIssues();
  if(!issues.length){ el.innerHTML = '<div class="issue ok">Проблем не найдено</div>'; return; }
  el.innerHTML = issues.map((iss,idx)=>`<div class="issue ${iss.sev==='err'?'err':'warn'}" data-idx="${idx}">${escapeHtml(iss.text)}</div>`).join('');
  el.querySelectorAll('.issue[data-idx]').forEach(div=>{
    div.addEventListener('click', ()=>{
      const iss = issues[+div.dataset.idx];
      state.selection = iss.objIds.slice();
      panToSelection();
      refreshAll();
    });
  });
}
function panToSelection(){
  if(!state.selection.length) return;
  const objs = state.selection.map(getObj).filter(Boolean); if(!objs.length) return;
  const pts = objs.flatMap(objBoundsWorld);
  const cx = pts.reduce((s,p)=>s+p.x,0)/pts.length, cy = pts.reduce((s,p)=>s+p.y,0)/pts.length;
  const wrap = document.getElementById('canvas-wrap');
  const sc = worldToScreen(cx,cy);
  state.view.ox += wrap.clientWidth/2 - sc.x;
  state.view.oy += wrap.clientHeight/2 - sc.y;
}

/* ======================= TOOLS: базовое взаимодействие (M1) ======================= */
let pointer = { down:false, startSx:0, startSy:0, mode:null, startView:null, dragOrig:null };

const RS_MARGIN = 18; // ширина полосы линеек, экранные px -- клики в этой зоне тянут направляющие
function findHandleAt(sx,sy){
  if(state.selection.length!==1) return null;
  const o = getObj(state.selection[0]); if(!o||o.locked) return null;
  const r = CONFIG.handleSizePx*0.9;
  const rp = worldToScreen2(rotateHandleWorldPos(o));
  if(Math.hypot(sx-rp.x,sy-rp.y)<=r+3) return {kind:'rotate', obj:o};
  for(const h of HANDLE_DEFS){
    const p = worldToScreen2(handleWorldPos(o,h));
    if(Math.hypot(sx-p.x,sy-p.y)<=r) return {kind:'resize', obj:o, handle:h};
  }
  return null;
}
canvas.addEventListener('pointerdown', (e)=>{
  canvas.setPointerCapture(e.pointerId);
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
  pointer.down = true; pointer.startSx=sx; pointer.startSy=sy;
  if(state.tool==='pan' || e.button===1 || spaceHeld){
    pointer.mode='pan'; pointer.startView = {...state.view};
    canvas.classList.add('panning');
    return;
  }
  if(state.tool && state.tool.startsWith('add-')){
    placePendingObject(screenToWorld(sx,sy));
    return;
  }
  if(pointer.pickOriginMode){
    pointer.pickOriginMode = false;
    const w0 = screenToWorld(sx,sy);
    const hit0 = hitTest(w0.x,w0.y);
    if(hit0){ setOriginMode('object', hit0.id); }
    $('#origin-mode').value = state.project.originMode;
    $('#st-msg').textContent='';
    return;
  }
  // клик по линейке -> тянем новую направляющую
  if(sx<RS_MARGIN || sy<RS_MARGIN){
    const axis = sy<RS_MARGIN && sx>=RS_MARGIN ? 'x' : (sx<RS_MARGIN && sy>=RS_MARGIN ? 'y' : null);
    if(axis){
      const g = {id:nextUid(), axis, pos_mm: axis==='x'?screenToWorld(sx,sy).x:screenToWorld(sx,sy).y};
      state.guides.push(g);
      pointer.mode='guide-drag'; pointer.guideId=g.id;
      return;
    }
  }
  const handleHit = findHandleAt(sx,sy);
  if(handleHit){
    startHandleDrag(handleHit, screenToWorld(sx,sy));
    return;
  }
  const w = screenToWorld(sx,sy);
  // проверка попадания в направляющую (для перетаскивания существующей)
  const gHit = hitGuide(sx,sy);
  if(gHit){ pointer.mode='guide-drag'; pointer.guideId=gHit.id; return; }
  // выбор по клику: ищем верхний объект под курсором
  const hit = hitTest(w.x,w.y);
  if(hit){
    if(hit.locked){ if(!e.shiftKey) state.selection=[]; }
    else if(e.shiftKey){
      state.selection = state.selection.includes(hit.id) ? state.selection.filter(id=>id!==hit.id) : state.selection.concat([hit.id]);
    } else if(!state.selection.includes(hit.id)){ state.selection=[hit.id]; }
    pointer.mode='drag';
    pointer.dragOrig = state.selection.map(id=>{ const o=getObj(id); return {id,x:o.x_mm,y:o.y_mm}; });
    pointer.dragStartWorld = w;
  } else {
    if(!e.shiftKey) state.selection=[];
    pointer.mode='marquee'; pointer.marqueeStart=w;
  }
  refreshAll();
});
function startHandleDrag(hit, mouseWorld){
  const o = hit.obj;
  pointer.mode = hit.kind;
  pointer.obj = o;
  pointer.startRotDeg = o.rot_deg;
  pointer.startXY = {x:o.x_mm, y:o.y_mm};
  pointer.startSize = o.type==='marker'||o.type==='text' ? (o.size_mm) : null;
  pointer.startWH = {w:o.w_mm, h:o.h_mm};
  const {cx,cy} = localAnchorOffset(o);
  pointer.centerOffsetLocal = {cx,cy};
  pointer.centerWorldStart = worldFromLocal(o,cx,cy, pointer.startRotDeg*Math.PI/180, pointer.startXY);
  if(hit.kind==='resize'){
    const h = hit.handle; const opp = oppositeHandle(h);
    const {hw,hh} = localHalfExtents(o);
    pointer.handle = h;
    pointer.anchorLocal = {x:cx+opp.lx*hw, y:cy+opp.ly*hh};
    pointer.handleLocal = {x:cx+h.lx*hw, y:cy+h.ly*hh};
    pointer.anchorWorld = worldFromLocal(o, pointer.anchorLocal.x, pointer.anchorLocal.y, pointer.startRotDeg*Math.PI/180, pointer.startXY);
    const dir = {x:pointer.handleLocal.x-pointer.anchorLocal.x, y:pointer.handleLocal.y-pointer.anchorLocal.y};
    const len = Math.hypot(dir.x,dir.y)||1;
    pointer.dirLocalUnit = {x:dir.x/len,y:dir.y/len};
    pointer.origDirLen = len;
    pointer.isSquare = (o.type==='marker'||o.type==='text');
  }
  refreshAll();
}
function hitGuide(sx,sy){
  const tol=5;
  for(const g of state.guides){
    const p = g.axis==='x'? worldToScreen(g.pos_mm,0) : worldToScreen(0,g.pos_mm);
    if(g.axis==='x' && Math.abs(sx-p.x)<=tol) return g;
    if(g.axis==='y' && Math.abs(sy-p.y)<=tol) return g;
  }
  return null;
}
window.addEventListener('pointermove',(e)=>{
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
  const w = screenToWorld(sx,sy);
  $('#st-cursor').textContent = fmtLen(w.x)+', '+fmtLen(w.y);
  if(!pointer.down) return;
  if(pointer.mode==='pan'){
    state.view.ox = pointer.startView.ox + (sx-pointer.startSx);
    state.view.oy = pointer.startView.oy + (sy-pointer.startSy);
    render();
  } else if(pointer.mode==='drag'){
    let dx = w.x-pointer.dragStartWorld.x, dy = w.y-pointer.dragStartWorld.y;
    const snapped = computeDragSnap(pointer.dragOrig, dx, dy);
    dx = snapped.dx; dy = snapped.dy;
    for(const it of pointer.dragOrig){
      const o = getObj(it.id); if(!o||o.locked) continue;
      o.x_mm = it.x+dx; o.y_mm = it.y+dy;
      if(state.whiteFieldAssist){ const p2 = applyWhiteFieldAssist(o,o.x_mm,o.y_mm); o.x_mm=p2.x; o.y_mm=p2.y; }
    }
    render();
    drawSmartGuides(snapped.lines);
  } else if(pointer.mode==='resize'){
    doResize(w, e.shiftKey);
    render();
  } else if(pointer.mode==='rotate'){
    doRotate(w, e.shiftKey);
    render();
  } else if(pointer.mode==='guide-drag'){
    const g = state.guides.find(x=>x.id===pointer.guideId); if(g){ g.pos_mm = g.axis==='x'?w.x:w.y; render(); }
  } else if(pointer.mode==='marquee'){
    pointer.marqueeCur = w;
    render();
    drawMarquee();
  }
});
function doResize(mouseWorld, shiftKey){
  const o = pointer.obj;
  const rot = pointer.startRotDeg*Math.PI/180;
  const rel = rotateVec(mouseWorld.x-pointer.anchorWorld.x, mouseWorld.y-pointer.anchorWorld.y, -rot);
  if(pointer.isSquare){
    const proj = rel.x*pointer.dirLocalUnit.x + rel.y*pointer.dirLocalUnit.y;
    const newLen = Math.max(4, snapLen(Math.abs(proj)));
    const scaleRatio = newLen/pointer.origDirLen;
    const newCenterLocal = { x: pointer.anchorLocal.x + pointer.dirLocalUnit.x*newLen/2,
                              y: pointer.anchorLocal.y + pointer.dirLocalUnit.y*newLen/2 };
    const newCenterWorld = worldFromLocal(o, newCenterLocal.x, newCenterLocal.y, rot, pointer.startXY);
    const newAnchorXY = { x: newCenterWorld.x - rotateVec(pointer.centerOffsetLocal.cx, pointer.centerOffsetLocal.cy, rot).x,
                           y: newCenterWorld.y - rotateVec(pointer.centerOffsetLocal.cx, pointer.centerOffsetLocal.cy, rot).y };
    o.x_mm = newAnchorXY.x; o.y_mm = newAnchorXY.y;
    if(o.type==='marker'){
      const outerHalfOrig = pointer.startSize/2 + o.quiet_zone_mm;
      o.size_mm = Math.max(4, 2*outerHalfOrig*scaleRatio - 2*o.quiet_zone_mm);
    } else {
      o.size_mm = Math.max(2, pointer.startSize*scaleRatio);
    }
  } else {
    const h = pointer.handle;
    let newW = pointer.startWH.w, newH = pointer.startWH.h;
    let offx = pointer.anchorLocal.x, offy = pointer.anchorLocal.y;
    if(h.edge && h.axis==='y'){
      newH = Math.max(2, snapLen(Math.abs(rel.y)));
      offy = pointer.anchorLocal.y + Math.sign(rel.y||1)*newH/2;
      offx = pointer.anchorLocal.x;
    } else if(h.edge && h.axis==='x'){
      newW = Math.max(2, snapLen(Math.abs(rel.x)));
      offx = pointer.anchorLocal.x + Math.sign(rel.x||1)*newW/2;
      offy = pointer.anchorLocal.y;
    } else {
      newW = Math.max(2, snapLen(Math.abs(rel.x)));
      newH = Math.max(2, snapLen(Math.abs(rel.y)));
      offx = pointer.anchorLocal.x + Math.sign(rel.x||1)*newW/2;
      offy = pointer.anchorLocal.y + Math.sign(rel.y||1)*newH/2;
    }
    const newCenterWorld = worldFromLocal(o, offx, offy, rot, pointer.startXY);
    o.x_mm = newCenterWorld.x; o.y_mm = newCenterWorld.y;
    o.w_mm = newW; o.h_mm = newH;
  }
}
function snapLen(v){ if(!state.ui.snap) return v; const step=state.project.gridStepMm; return Math.max(step, Math.round(v/step)*step); }
function doRotate(mouseWorld, shiftKey){
  const o = pointer.obj;
  const c = pointer.centerWorldStart;
  const startHandle = rotateHandleAtStart();
  const startAngle = Math.atan2(startHandle.y - c.y, startHandle.x - c.x);
  const curAngle = Math.atan2(mouseWorld.y-c.y, mouseWorld.x-c.x);
  let deltaDeg = (curAngle-startAngle)*180/Math.PI;
  let newRot = pointer.startRotDeg + deltaDeg;
  if(shiftKey) newRot = Math.round(newRot/15)*15;
  const newRad = newRot*Math.PI/180;
  const newAnchorXY = { x: c.x - rotateVec(pointer.centerOffsetLocal.cx,pointer.centerOffsetLocal.cy,newRad).x,
                         y: c.y - rotateVec(pointer.centerOffsetLocal.cx,pointer.centerOffsetLocal.cy,newRad).y };
  o.rot_deg = ((newRot%360)+360)%360;
  o.x_mm = newAnchorXY.x; o.y_mm = newAnchorXY.y;
}
function rotateHandleAtStart(){
  const o = pointer.obj;
  return worldFromLocal(o, pointer.centerOffsetLocal.cx, pointer.centerOffsetLocal.cy + (localHalfExtents(o).hh + CONFIG.rotateHandleOffsetPx/state.view.scale), pointer.startRotDeg*Math.PI/180, pointer.startXY);
}
canvas.addEventListener('dblclick',(e)=>{
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
  const g = hitGuide(sx,sy);
  if(g){ state.guides = state.guides.filter(x=>x.id!==g.id); pushHistory(); refreshAll(); }
});
window.addEventListener('pointerup',(e)=>{
  // Слушатель висит на window (нужно ловить отпускание за пределами канваса при
  // перетаскивании), поэтому он получает pointerup от ЛЮБОГО клика на странице --
  // включая клик по полю ввода в панели свойств. refreshAll() ниже перестраивает
  // innerHTML панели свойств, что уничтожает и пересоздаёт DOM-узел инпута -- если
  // делать это на каждый клик, только что сфокусированное поле тут же теряет фокус
  // и с клавиатуры в него ничего не ввести. Поэтому реагируем только если это
  // отпускание завершает РЕАЛЬНОЕ взаимодействие с канвасом (mode было выставлено
  // в его собственном pointerdown), а не произвольный клик где-то на странице.
  const hadMode = pointer.mode;
  if(!hadMode){ pointer.down=false; return; }
  if(pointer.mode==='guide-drag'){
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
    if(sx<RS_MARGIN || sy<RS_MARGIN){ state.guides = state.guides.filter(g=>g.id!==pointer.guideId); }
  }
  if(pointer.mode==='marquee' && pointer.marqueeCur){
    const x0=Math.min(pointer.marqueeStart.x,pointer.marqueeCur.x), x1=Math.max(pointer.marqueeStart.x,pointer.marqueeCur.x);
    const y0=Math.min(pointer.marqueeStart.y,pointer.marqueeCur.y), y1=Math.max(pointer.marqueeStart.y,pointer.marqueeCur.y);
    const inMarquee = state.objects.filter(o=>{
      const pts = objBoundsWorld(o);
      return pts.every(p=>p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1);
    }).map(o=>o.id);
    state.selection = Array.from(new Set(state.selection.concat(inMarquee)));
  }
  if(pointer.mode==='drag' || pointer.mode==='resize' || pointer.mode==='rotate' || pointer.mode==='guide-drag') pushHistory();
  pointer.down=false; pointer.mode=null;
  canvas.classList.remove('panning');
  refreshAll();
});
function drawMarquee(){
  if(!pointer.marqueeCur) return;
  const a = worldToScreen(pointer.marqueeStart.x,pointer.marqueeStart.y);
  const b = worldToScreen(pointer.marqueeCur.x,pointer.marqueeCur.y);
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.strokeStyle=CONFIG.colors.selection; ctx.fillStyle='rgba(76,154,255,.12)';
  ctx.fillRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y));
  ctx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y));
  ctx.restore();
}
// Привязка при перетаскивании: сначала умные направляющие (центры/края/равные
// интервалы относительно других объектов), при их отсутствии -- сетка.
// Возвращает {dx,dy,lines}: lines -- список подсвечиваемых линий привязки (world-координаты).
function bboxOf(pts){
  return { minX:Math.min(...pts.map(p=>p.x)), maxX:Math.max(...pts.map(p=>p.x)),
           minY:Math.min(...pts.map(p=>p.y)), maxY:Math.max(...pts.map(p=>p.y)) };
}
function computeDragSnap(dragOrig, dx, dy){
  if(!dragOrig.length) return {dx,dy,lines:[]};
  if(!state.ui.snap) return {dx,dy,lines:[]};
  const draggedIds = new Set(dragOrig.map(d=>d.id));
  const others = state.objects.filter(o=>!draggedIds.has(o.id) && !o.hidden);
  const otherBoxes = others.map(o=>bboxOf(objBoundsWorld(o)));

  // bbox перетаскиваемой группы при текущем (пока не привязанном) сдвиге dx,dy
  function groupBoxAt(ddx,ddy){
    let r={minX:Infinity,maxX:-Infinity,minY:Infinity,maxY:-Infinity};
    for(const d of dragOrig){
      const o=getObj(d.id); const sx=o.x_mm, sy=o.y_mm;
      o.x_mm=d.x+ddx; o.y_mm=d.y+ddy;
      const b=bboxOf(objBoundsWorld(o));
      o.x_mm=sx; o.y_mm=sy;
      r.minX=Math.min(r.minX,b.minX); r.maxX=Math.max(r.maxX,b.maxX);
      r.minY=Math.min(r.minY,b.minY); r.maxY=Math.max(r.maxY,b.maxY);
    }
    return r;
  }
  const g = groupBoxAt(dx,dy);
  const gCx=(g.minX+g.maxX)/2, gCy=(g.minY+g.maxY)/2;
  const tolMm = CONFIG.snapPixelRadius/state.view.scale;
  const lines=[];

  function bestAxisSnap(candidates, others1D, spanMinFn, spanMaxFn){
    let bestDelta=null, bestDist=tolMm, bestOv=null;
    for(const cand of candidates){
      for(const ov of others1D){
        const d = Math.abs(cand.v-ov.v);
        if(d<bestDist){ bestDist=d; bestDelta=ov.v-cand.v; bestOv=ov; }
      }
    }
    return bestDelta==null? null : {delta:bestDelta, ov:bestOv};
  }
  const othersX = []; const othersY = [];
  for(const b of otherBoxes){
    othersX.push({v:b.minX,k:'edge'},{v:b.maxX,k:'edge'},{v:(b.minX+b.maxX)/2,k:'center'});
    othersY.push({v:b.minY,k:'edge'},{v:b.maxY,k:'edge'},{v:(b.minY+b.maxY)/2,k:'center'});
  }
  for(const g of state.guides){
    if(g.axis==='x') othersX.push({v:g.pos_mm,k:'guide'}); else othersY.push({v:g.pos_mm,k:'guide'});
  }
  let outDx=dx, outDy=dy;
  const sx = bestAxisSnap([{v:g.minX},{v:g.maxX},{v:gCx}], othersX);
  if(sx){
    outDx = dx+sx.delta;
    const gg = groupBoxAt(outDx,dy);
    const y0=Math.min(gg.minY, ...otherBoxes.map(b=>b.minY)), y1=Math.max(gg.maxY, ...otherBoxes.map(b=>b.maxY));
    lines.push({x1:sx.ov.v,y1:y0,x2:sx.ov.v,y2:y1});
  }
  const sy = bestAxisSnap([{v:g.minY},{v:g.maxY},{v:gCy}], othersY);
  if(sy){
    outDy = dy+sy.delta;
    const gg = groupBoxAt(outDx,outDy);
    const x0=Math.min(gg.minX, ...otherBoxes.map(b=>b.minX)), x1=Math.max(gg.maxX, ...otherBoxes.map(b=>b.maxX));
    lines.push({x1:x0,y1:sy.ov.v,x2:x1,y2:sy.ov.v});
  }
  // сетка -- по осям, где умная привязка не сработала
  const step = state.project.gridStepMm;
  if(!sx) outDx = Math.round(dx/step)*step;
  if(!sy) outDy = Math.round(dy/step)*step;
  return {dx:outDx, dy:outDy, lines};
}
function drawSmartGuides(lines){
  if(!lines || !lines.length) return;
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.strokeStyle = CONFIG.colors.smartGuide; ctx.lineWidth=1;
  for(const l of lines){
    const a = worldToScreen(l.x1,l.y1), b = worldToScreen(l.x2,l.y2);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  ctx.restore();
}
function snapVal(v){
  if(!state.ui.snap) return v;
  const step = state.project.gridStepMm;
  return Math.round(v/step)*step;
}
function hitTest(x,y){
  const ordered = zOrdered().reverse();
  for(const o of ordered){
    if(o.hidden||o.locked) continue;
    if(pointInObj(x,y,o)) return o;
  }
  return null;
}
function pointInObj(x,y,o){
  const pts = objBoundsWorld(o);
  // point-in-polygon (ray casting), pts всегда 4 точки (возможно повёрнутый прямоугольник)
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
    const intersect = ((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}

canvas.addEventListener('wheel',(e)=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
  const before = screenToWorld(sx,sy);
  const factor = Math.pow(1.0015, -e.deltaY);
  state.view.scale = Math.min(200, Math.max(0.01, state.view.scale*factor));
  const after = worldToScreen(before.x,before.y);
  state.view.ox += sx-after.x; state.view.oy += sy-after.y;
  $('#zoom-label').textContent = Math.round(state.view.scale*100)+'%';
  render();
}, {passive:false});

let spaceHeld=false;
window.addEventListener('keydown',(e)=>{
  if(e.code==='Space' && !spaceHeld){ spaceHeld=true; canvas.classList.add('tool-pan'); }
  if(e.target.tagName==='INPUT') return;
  // Горячие клавиши с буквами определяем по e.code (физическое положение клавиши,
  // KeyC/KeyV/... как на стандартной QWERTY-раскладке), а НЕ по e.key -- на русской
  // раскладке e.key для Ctrl+C возвращает кириллический символ ('с'), и сравнение с
  // 'c' не срабатывает. code не зависит от активной раскладки ввода.
  if(e.key==='Escape'){ setTool('select'); if(pointer.pickOriginMode){ pointer.pickOriginMode=false; $('#origin-mode').value=state.project.originMode; $('#st-msg').textContent=''; } }
  else if(e.code==='KeyV' && !e.ctrlKey){ setTool('select'); }
  else if(e.code==='KeyH' && !e.ctrlKey){ setTool('pan'); }
  else if(e.ctrlKey && e.code==='KeyZ' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if(e.ctrlKey && (e.code==='KeyY' || (e.code==='KeyZ'&&e.shiftKey))){ e.preventDefault(); redo(); }
  else if(e.key==='Delete' || e.key==='Backspace'){
    if(state.selection.length){ state.objects = state.objects.filter(o=>!state.selection.includes(o.id)); state.selection=[]; pushHistory(); refreshAll(); }
  } else if(e.ctrlKey && e.code==='KeyA'){
    e.preventDefault(); state.selection = state.objects.filter(o=>!o.locked).map(o=>o.id); refreshAll();
  } else if(e.ctrlKey && e.code==='KeyC'){
    e.preventDefault();
    $('#btn-copy').click();
  } else if(e.ctrlKey && e.code==='KeyV'){
    e.preventDefault();
    $('#btn-paste').click();
  } else if(e.ctrlKey && e.code==='KeyD'){
    e.preventDefault();
    $('#btn-duplicate').click();
  } else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    const step = e.shiftKey? state.project.gridStepMm : 1;
    const dx = e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0;
    const dy = e.key==='ArrowUp'?step:e.key==='ArrowDown'?-step:0;
    for(const id of state.selection){ const o=getObj(id); if(o&&!o.locked){o.x_mm+=dx;o.y_mm+=dy;} }
    if(state.selection.length){ render(); }
  }
});
