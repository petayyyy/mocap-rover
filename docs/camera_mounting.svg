<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 840" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a5f"/></marker>
    <!-- camera with the long side of the frame along X; ribbon (bottom of frame) toward -Y (down on the plan) -->
    <g id="camx">
      <rect x="-30" y="-16" width="60" height="32" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
      <rect x="-9" y="16" width="18" height="10" fill="#c8102e"/>
      <text x="0" y="4" text-anchor="middle" font-size="10" fill="#1f3a5f">1640 px</text>
      <circle cx="0" cy="-6" r="2.5" fill="#1f3a5f"/>
    </g>
    <!-- camera with the long side along Y; ribbon (bottom of frame) toward -X (left on the plan) -->
    <g id="camy">
      <rect x="-16" y="-30" width="32" height="60" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
      <rect x="-26" y="-9" width="10" height="18" fill="#c8102e"/>
      <text x="0" y="0" text-anchor="middle" font-size="10" fill="#1f3a5f" transform="rotate(-90) translate(0,4)">1640 px</text>
      <circle cx="6" cy="0" r="2.5" fill="#1f3a5f"/>
    </g>
  </defs>
  <rect width="1400" height="840" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">Монтаж 6 камер IMX219-160 на пяти точках потолка, Z = 2.9 м, арена 12×12 м</text>
  <text x="20" y="52" font-size="13" fill="#333">Вид сверху (план): ось X вправо, ось Y вверх, начало координат в углу пола. Все камеры объективом строго вниз, без наклона. Красный язычок = разъём шлейфа = НИЗ кадра.</text>

  <g transform="translate(70,90)">
    <rect x="0" y="0" width="600" height="600" fill="#f3f5f7" stroke="#111" stroke-width="2"/>
    <g stroke="#d5dae0" stroke-width="1">
      <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/><line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="500" y1="0" x2="500" y2="600"/>
      <line x1="0" y1="100" x2="600" y2="100"/><line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="300" x2="600" y2="300"/><line x1="0" y1="400" x2="600" y2="400"/><line x1="0" y1="500" x2="600" y2="500"/>
    </g>
    <g fill="#333" font-size="12">
      <text x="-4" y="616">0</text><text x="290" y="616">6 м</text><text x="580" y="616">12 м</text>
      <text x="-26" y="304">6 м</text><text x="-30" y="10">12 м</text>
      <text x="612" y="606" font-weight="bold" font-size="14">X</text><text x="-6" y="-8" font-weight="bold" font-size="14">Y</text>
    </g>
    <!-- mounting points -->
    <g fill="none" stroke="#9aa3ad" stroke-width="1" stroke-dasharray="4 3">
      <circle cx="150" cy="450" r="24"/><circle cx="450" cy="450" r="24"/><circle cx="150" cy="150" r="24"/><circle cx="450" cy="150" r="24"/><circle cx="300" cy="300" r="42"/>
    </g>
    <!-- corner cameras, nadir, long side along X -->
    <g transform="translate(150,450)"><use xlink:href="#camx"/><text x="-40" y="46" font-weight="bold">camera_1 (3, 3)</text><text x="-40" y="62" fill="#c8102e" font-size="12">низ кадра / шлейф → −Y</text></g>
    <g transform="translate(450,450)"><use xlink:href="#camx"/><text x="-40" y="46" font-weight="bold">camera_2 (9, 3)</text><text x="-40" y="62" fill="#c8102e" font-size="12">низ кадра / шлейф → −Y</text></g>
    <g transform="translate(150,150)"><use xlink:href="#camx"/><text x="-40" y="-26" font-weight="bold">camera_3 (3, 9)</text><text x="-40" y="-42" fill="#c8102e" font-size="12">низ кадра / шлейф → −Y</text></g>
    <g transform="translate(450,150)"><use xlink:href="#camx"/><text x="-40" y="-26" font-weight="bold">camera_4 (9, 9)</text><text x="-40" y="-42" fill="#c8102e" font-size="12">низ кадра / шлейф → −Y</text></g>
    <!-- centre pair on one mount: (5.7,6) long side X, (6.3,6) long side Y; lidar (6,6) between and 15 cm lower -->
    <g transform="translate(285,300)"><use xlink:href="#camx"/></g>
    <g transform="translate(315,300)"><use xlink:href="#camy"/></g>
    <g transform="translate(300,300)"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="#ffffff" stroke="#6b21a8" stroke-width="2"/></g>
    <text x="300" y="352" text-anchor="middle" font-weight="bold">центральное крепление (6, 6)</text>
    <text x="300" y="368" text-anchor="middle" font-size="12">camera_5 (5.85, 6): длинная сторона вдоль X, шлейф → −Y</text>
    <text x="300" y="384" text-anchor="middle" font-size="12">camera_6 (6.15, 6): длинная сторона вдоль Y, шлейф → −X</text>
    <text x="300" y="400" text-anchor="middle" font-size="12" fill="#6b21a8">лидар Airy (6, 6) между ними, на 2.75 м</text>
    <text x="300" y="416" text-anchor="middle" font-size="12">центры камер в 0.30 м (мин. по габариту лидара, макс. 0.60)</text>
  </g>

  <g transform="translate(720,90)" fill="#111">
    <text x="0" y="0" font-size="15" font-weight="bold">Обозначения</text>
    <rect x="0" y="12" width="40" height="22" fill="#fff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="50" y="22" font-size="12">плата камеры; длинная сторона прямоугольника =</text>
    <text x="50" y="36" font-size="12">длинная сторона кадра (1640 px), точка — объектив</text>
    <rect x="12" y="46" width="16" height="10" fill="#c8102e"/>
    <text x="50" y="56" font-size="12">сторона разъёма шлейфа = низ кадра (строка 1232)</text>
    <circle cx="20" cy="76" r="12" fill="none" stroke="#9aa3ad" stroke-dasharray="4 3"/>
    <text x="50" y="80" font-size="12">точка крепления на потолке (крепёжные отверстия)</text>
    <rect x="14" y="94" width="12" height="12" transform="rotate(45 20 100)" fill="#fff" stroke="#6b21a8" stroke-width="2"/>
    <text x="50" y="104" font-size="12">лидар RoboSense Airy, объективом вниз</text>

    <text x="0" y="140" font-size="15" font-weight="bold">Таблица монтажа (все объективом вниз, 0° наклона, Z = 2.9 м)</text>
    <g font-size="12">
      <text x="0" y="162" font-weight="bold">камера</text><text x="80" y="162" font-weight="bold">X, м</text><text x="130" y="162" font-weight="bold">Y, м</text><text x="180" y="162" font-weight="bold">крепление</text><text x="290" y="162" font-weight="bold">длинная сторона</text><text x="410" y="162" font-weight="bold">низ кадра (шлейф)</text>
      <line x1="0" y1="168" x2="560" y2="168" stroke="#999"/>
      <text x="0" y="186">camera_1</text><text x="80" y="186">3</text><text x="130" y="186">3</text><text x="180" y="186">угловое</text><text x="290" y="186">вдоль X</text><text x="410" y="186">−Y (к борту y = 0)</text>
      <text x="0" y="204">camera_2</text><text x="80" y="204">9</text><text x="130" y="204">3</text><text x="180" y="204">угловое</text><text x="290" y="204">вдоль X</text><text x="410" y="204">−Y (к борту y = 0)</text>
      <text x="0" y="222">camera_3</text><text x="80" y="222">3</text><text x="130" y="222">9</text><text x="180" y="222">угловое</text><text x="290" y="222">вдоль X</text><text x="410" y="222">−Y (к центру арены)</text>
      <text x="0" y="240">camera_4</text><text x="80" y="240">9</text><text x="130" y="240">9</text><text x="180" y="240">угловое</text><text x="290" y="240">вдоль X</text><text x="410" y="240">−Y (к центру арены)</text>
      <text x="0" y="258">camera_5</text><text x="80" y="258">5.85</text><text x="130" y="258">6</text><text x="180" y="258">центральное</text><text x="290" y="258">вдоль X</text><text x="410" y="258">−Y</text>
      <text x="0" y="276">camera_6</text><text x="80" y="276">6.15</text><text x="130" y="276">6</text><text x="180" y="276">центральное</text><text x="290" y="276">вдоль Y</text><text x="410" y="276">−X</text>
      <text x="0" y="294">лидар</text><text x="80" y="294">6</text><text x="130" y="294">6</text><text x="180" y="294">центральное</text><text x="290" y="294">Z = 2.75 м, вниз</text>
    </g>

    <text x="0" y="334" font-size="15" font-weight="bold">Центральное крепление, вид сбоку (сечение Y = 6)</text>
    <g transform="translate(0,356)">
      <line x1="0" y1="0" x2="520" y2="0" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="0" y="-6" fill="#666" font-size="12">потолок</text>
      <rect x="170" y="0" width="30" height="10" fill="#1f3a5f"/><text x="140" y="30" font-size="12">camera_5, x = 5.85</text>
      <rect x="320" y="0" width="30" height="10" fill="#1f3a5f"/><text x="300" y="30" font-size="12">camera_6, x = 6.15</text>
      <line x1="185" y1="10" x2="185" y2="110" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="335" y1="10" x2="335" y2="110" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="260" y1="0" x2="260" y2="40" stroke="#6b21a8" stroke-width="2"/>
      <rect x="240" y="40" width="40" height="26" fill="#ffffff" stroke="#6b21a8" stroke-width="2"/>
      <text x="230" y="84" font-size="12" fill="#6b21a8">лидар, x = 6, Z = 2.75</text>
      <line x1="185" y1="128" x2="335" y2="128" stroke="#333" stroke-width="1"/><text x="228" y="144" font-size="12">0.30 м</text>
      <line x1="380" y1="0" x2="380" y2="53" stroke="#333" stroke-width="1"/><text x="386" y="34" font-size="12">0.15 м</text>
      <text x="0" y="172" font-size="12">Камеры на 2.9 м, лидар подвешен ниже на 2.75 м ровно между ними: его корпус попадает</text>
      <text x="0" y="188" font-size="12">в край кадра обеих центральных камер (≈ 63° от оси) и закрывает от каждой узкий сектор дальнего</text>
      <text x="0" y="204" font-size="12">пола, который видят угловые камеры. Заслонение проверяется в Gazebo (промпт 06).</text>
    </g>

    <g transform="translate(0,590)" font-size="12" fill="#7a1f00">
      <text x="0" y="0" font-weight="bold" font-size="13">Проверить до изготовления крепежа</text>
      <text x="0" y="20">1. «Сторона шлейфа = низ кадра» взято по компоновке Raspberry Pi Camera v2 (кадр прямой, когда шлейф</text>
      <text x="0" y="36">   уходит вниз). Для Waveshare IMX219-160 подтвердить одним кадром: держать плату шлейфом к себе,</text>
      <text x="0" y="52">   низ кадра у шлейфа. Если наоборот, стрелки «низ кадра» разворачиваются на 180°, координаты те же.</text>
      <text x="0" y="74">2. Допуск монтажа ±1 см по осям и ±0.5° по углам, остальное снимет калибровка. Наклон 0° у всех:</text>
      <text x="0" y="90">   на пяти точках наклон угловых камер к центру покрытие только ухудшает (99.4 % → 97 % при 10°).</text>
      <text x="0" y="112">3. Объектив 160°: крепёж, шлейф и кабели не выступают ниже плоскости платы в радиусе 5 см от объектива.</text>
      <text x="0" y="134">4. Центральное крепление: камеры как можно ближе (ограничение только максимум 0.60 м), лидар между ними на 15 см ниже;</text>
      <text x="0" y="150">   корпус лидара не ближе 25 см по горизонтали к объективам — отсюда разнос ≈ 0.30 м.</text>
      <text x="0" y="172">5. Раскладка подлежит проверке в Gazebo (промпт 06) до передачи в производство.</text>
    </g>
  </g>
</svg>
