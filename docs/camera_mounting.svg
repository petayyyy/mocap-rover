<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 820" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a5f"/></marker>
    <!-- corner camera: long side of frame along X, ribbon (bottom of frame) toward -Y (down on the plan) -->
    <g id="cornercam">
      <rect x="-30" y="-16" width="60" height="32" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
      <rect x="-9" y="16" width="18" height="10" fill="#c8102e"/>
      <text x="0" y="4" text-anchor="middle" font-size="10" fill="#1f3a5f">1640 px</text>
    </g>
    <!-- middle camera: long side of frame along Y, ribbon (bottom of frame) toward -X (left on the plan) -->
    <g id="midcam">
      <rect x="-16" y="-30" width="32" height="60" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
      <rect x="-26" y="-9" width="10" height="18" fill="#c8102e"/>
      <text x="0" y="0" text-anchor="middle" font-size="10" fill="#1f3a5f" transform="rotate(-90) translate(0,4)">1640 px</text>
    </g>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">Монтаж 6 камер IMX219-160 на потолке Z = 2.9 м, арена 12×12 м</text>
  <text x="20" y="52" font-size="13" fill="#333">Вид сверху (план): ось X вправо, ось Y вверх, начало координат в углу пола. Красный язычок на плате = сторона разъёма шлейфа = НИЗ кадра.</text>

  <g transform="translate(70,90)">
    <rect x="0" y="0" width="600" height="600" fill="#f3f5f7" stroke="#111" stroke-width="2"/>
    <g stroke="#d5dae0" stroke-width="1">
      <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/><line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/><line x1="500" y1="0" x2="500" y2="600"/>
      <line x1="0" y1="100" x2="600" y2="100"/><line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="300" x2="600" y2="300"/><line x1="0" y1="400" x2="600" y2="400"/><line x1="0" y1="500" x2="600" y2="500"/>
    </g>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#8a94a0" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="470" y="292" fill="#8a94a0" font-size="12">осевая линия Y = 6 м</text>
    <g fill="#333" font-size="12">
      <text x="-4" y="616">0</text><text x="290" y="616">6 м</text><text x="580" y="616">12 м</text>
      <text x="-26" y="304">6 м</text><text x="-30" y="10">12 м</text>
      <text x="612" y="606" font-weight="bold" font-size="14">X</text><text x="-6" y="-8" font-weight="bold" font-size="14">Y</text>
    </g>
    <g transform="translate(300,300)">
      <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="none" stroke="#6b21a8" stroke-width="2"/>
      <text x="0" y="52" text-anchor="middle" fill="#6b21a8" font-size="12">лидар Airy (6, 6, 2.75), вниз</text>
    </g>

    <!-- camera_1 (3,2): plan y = 600-100 = 500 -->
    <g transform="translate(150,500)">
      <use xlink:href="#cornercam"/>
      <line x1="0" y1="-18" x2="0" y2="-64" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
      <text x="6" y="-44" fill="#1f3a5f" font-size="12">наклон 10° к +Y</text>
      <text x="-40" y="46" font-weight="bold">camera_1 (3, 2)</text>
      <text x="-40" y="62" fill="#c8102e" font-size="12">низ кадра / шлейф → −Y</text>
    </g>
    <g transform="translate(450,500)">
      <use xlink:href="#cornercam"/>
      <line x1="0" y1="-18" x2="0" y2="-64" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
      <text x="6" y="-44" fill="#1f3a5f" font-size="12">наклон 10° к +Y</text>
      <text x="-40" y="46" font-weight="bold">camera_2 (9, 2)</text>
      <text x="-40" y="62" fill="#c8102e" font-size="12">низ кадра / шлейф → −Y</text>
    </g>
    <!-- camera_5 (3,10): plan y = 100 -->
    <g transform="translate(150,100)">
      <use xlink:href="#cornercam"/>
      <line x1="0" y1="28" x2="0" y2="74" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
      <text x="6" y="58" fill="#1f3a5f" font-size="12">наклон 10° к −Y</text>
      <text x="-40" y="-26" font-weight="bold">camera_5 (3, 10)</text>
      <text x="-40" y="-42" fill="#c8102e" font-size="12">низ кадра / шлейф → −Y (к центру)</text>
    </g>
    <g transform="translate(450,100)">
      <use xlink:href="#cornercam"/>
      <line x1="0" y1="28" x2="0" y2="74" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
      <text x="6" y="58" fill="#1f3a5f" font-size="12">наклон 10° к −Y</text>
      <text x="-40" y="-26" font-weight="bold">camera_6 (9, 10)</text>
      <text x="-40" y="-42" fill="#c8102e" font-size="12">низ кадра / шлейф → −Y (к центру)</text>
    </g>
    <!-- camera_3 (3,6), camera_4 (9,6): plan y = 300 -->
    <g transform="translate(150,300)">
      <use xlink:href="#midcam"/>
      <circle cx="0" cy="0" r="3.5" fill="#1f3a5f"/>
      <text x="22" y="-14" font-weight="bold">camera_3 (3, 6)</text>
      <text x="22" y="2" fill="#1f3a5f" font-size="12">в надир, 0°</text>
      <text x="22" y="18" fill="#c8102e" font-size="12">низ кадра / шлейф → −X</text>
    </g>
    <g transform="translate(450,300)">
      <use xlink:href="#midcam"/>
      <circle cx="0" cy="0" r="3.5" fill="#1f3a5f"/>
      <text x="22" y="-14" font-weight="bold">camera_4 (9, 6)</text>
      <text x="22" y="2" fill="#1f3a5f" font-size="12">в надир, 0°</text>
      <text x="22" y="18" fill="#c8102e" font-size="12">низ кадра / шлейф → −X</text>
    </g>
  </g>

  <g transform="translate(720,90)" fill="#111">
    <text x="0" y="0" font-size="15" font-weight="bold">Обозначения</text>
    <rect x="0" y="12" width="40" height="22" fill="#fff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="50" y="22" font-size="12">плата камеры; длинная сторона прямоугольника =</text>
    <text x="50" y="36" font-size="12">длинная сторона кадра (1640 px)</text>
    <rect x="12" y="46" width="16" height="10" fill="#c8102e"/>
    <text x="50" y="56" font-size="12">сторона разъёма шлейфа = низ кадра (строка 1232)</text>
    <line x1="0" y1="76" x2="40" y2="76" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
    <text x="50" y="80" font-size="12">наклон оптической оси, 10° от вертикали</text>
    <circle cx="20" cy="100" r="3.5" fill="#1f3a5f"/>
    <text x="50" y="104" font-size="12">оптическая ось строго вниз</text>

    <text x="0" y="140" font-size="15" font-weight="bold">Таблица монтажа (объектив вниз, Z = 2.9 м)</text>
    <g font-size="12">
      <text x="0" y="162" font-weight="bold">камера</text><text x="80" y="162" font-weight="bold">X, м</text><text x="125" y="162" font-weight="bold">Y, м</text><text x="170" y="162" font-weight="bold">наклон оси</text><text x="280" y="162" font-weight="bold">длинная сторона</text><text x="400" y="162" font-weight="bold">низ кадра (шлейф)</text>
      <line x1="0" y1="168" x2="540" y2="168" stroke="#999"/>
      <text x="0" y="186">camera_1</text><text x="80" y="186">3</text><text x="125" y="186">2</text><text x="170" y="186">10° к +Y</text><text x="280" y="186">вдоль X</text><text x="400" y="186">−Y (к борту y = 0)</text>
      <text x="0" y="204">camera_2</text><text x="80" y="204">9</text><text x="125" y="204">2</text><text x="170" y="204">10° к +Y</text><text x="280" y="204">вдоль X</text><text x="400" y="204">−Y (к борту y = 0)</text>
      <text x="0" y="222">camera_3</text><text x="80" y="222">3</text><text x="125" y="222">6</text><text x="170" y="222">0°, надир</text><text x="280" y="222">вдоль Y</text><text x="400" y="222">−X (к борту x = 0)</text>
      <text x="0" y="240">camera_4</text><text x="80" y="240">9</text><text x="125" y="240">6</text><text x="170" y="240">0°, надир</text><text x="280" y="240">вдоль Y</text><text x="400" y="240">−X (к борту x = 0)</text>
      <text x="0" y="258">camera_5</text><text x="80" y="258">3</text><text x="125" y="258">10</text><text x="170" y="258">10° к −Y</text><text x="280" y="258">вдоль X</text><text x="400" y="258">−Y (к центру арены)</text>
      <text x="0" y="276">camera_6</text><text x="80" y="276">9</text><text x="125" y="276">10</text><text x="170" y="276">10° к −Y</text><text x="280" y="276">вдоль X</text><text x="400" y="276">−Y (к центру арены)</text>
    </g>

    <text x="0" y="316" font-size="15" font-weight="bold">Наклон угловых камер, вид сбоку (сечение X = 3 м или X = 9 м)</text>
    <g transform="translate(0,340)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="0" y="-6" fill="#666" font-size="12">потолок, Z = 2.9 м</text>
      <text x="62" y="-6" fill="#666" font-size="12">y = 2</text><text x="222" y="-6" fill="#666" font-size="12">y = 6</text><text x="382" y="-6" fill="#666" font-size="12">y = 10</text>
      <line x1="0" y1="130" x2="480" y2="130" stroke="#111" stroke-width="2"/>
      <text x="0" y="148" font-size="12">пол, Z = 0</text>
      <rect x="73" y="0" width="14" height="6" fill="#1f3a5f"/>
      <line x1="80" y1="6" x2="80" y2="130" stroke="#bbb" stroke-dasharray="3 3"/>
      <line x1="80" y1="6" x2="102" y2="130" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
      <text x="86" y="70" fill="#1f3a5f" font-size="12">10°</text>
      <rect x="237" y="0" width="6" height="14" fill="#1f3a5f"/>
      <line x1="240" y1="14" x2="240" y2="130" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
      <text x="246" y="70" fill="#1f3a5f" font-size="12">0°</text>
      <rect x="393" y="0" width="14" height="6" fill="#1f3a5f"/>
      <line x1="400" y1="6" x2="400" y2="130" stroke="#bbb" stroke-dasharray="3 3"/>
      <line x1="400" y1="6" x2="378" y2="130" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ah)"/>
      <text x="356" y="70" fill="#1f3a5f" font-size="12">10°</text>
      <text x="0" y="172" font-size="12">Ось каждой угловой камеры повёрнута на 10° вокруг оси X к осевой линии Y = 6.</text>
      <text x="0" y="188" font-size="12">Поворота вокруг Z нет, стороны кадра параллельны бортам. Все камеры на 2.9 м, объективом вниз.</text>
    </g>

    <g transform="translate(0,560)" font-size="12" fill="#7a1f00">
      <text x="0" y="0" font-weight="bold" font-size="13">Проверить до изготовления крепежа</text>
      <text x="0" y="20">1. «Сторона шлейфа = низ кадра» взято по компоновке Raspberry Pi Camera v2 (кадр прямой,</text>
      <text x="0" y="36">   когда шлейф уходит вниз). Для Waveshare IMX219-160 подтвердить одним кадром: держать плату</text>
      <text x="0" y="52">   шлейфом к себе, низ кадра должен быть у шлейфа. Если наоборот, все стрелки «низ кадра»</text>
      <text x="0" y="68">   разворачиваются на 180°; координаты и наклоны не меняются.</text>
      <text x="0" y="90">2. Допуск монтажа ±1 см по осям и ±0.5° по углам, остальное снимет калибровка.</text>
      <text x="0" y="106">   Регулировка наклона угловых камер в пределах 10° ± 3° желательна.</text>
      <text x="0" y="128">3. Объектив 160°: крепёж, шлейф и кабели не должны выступать ниже плоскости платы</text>
      <text x="0" y="144">   в радиусе 5 см от объектива.</text>
      <text x="0" y="166">4. Лидар в центре потолка на 2.75 м, объективом вниз; камеры выше него (2.9 м) и вне его конуса.</text>
    </g>
  </g>
</svg>
